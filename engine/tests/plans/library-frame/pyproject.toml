[project]
name = "frame"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch", "jaxtyping", "numpy"]

[project.scripts]
frame = "frame.train:main"

# The libraries the program imports, as their stubs: in place of an installed environment.
[tool.ty.environment]
extra-paths = ["typings"]
