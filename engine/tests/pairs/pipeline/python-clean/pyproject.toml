[project]
name = "sunspots"
version = "0.1.0"
description = "The monthly mean sunspot number from SILSO, smoothed and drawn"
requires-python = ">=3.12"
dependencies = ["matplotlib", "pandas", "requests", "typer"]

[project.scripts]
sunspots = "sunspots.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The libraries the program imports, as their stubs: in place of an installed environment.
[tool.ty.environment]
extra-paths = ["../typings"]
