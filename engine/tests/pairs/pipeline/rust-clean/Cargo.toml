[package]
name = "sunspots"
version = "0.1.0"
edition = "2021"
description = "The monthly mean sunspot number from SILSO, smoothed and drawn"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
plotters = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
