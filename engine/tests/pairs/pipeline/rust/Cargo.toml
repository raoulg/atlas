[package]
name = "sunspots"
version = "0.1.0"
edition = "2021"
description = "Downloads SILSO's monthly sunspot numbers, smooths them and draws them"

[dependencies]
chrono = "0.4"
csv = "1.3"
plotters = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
