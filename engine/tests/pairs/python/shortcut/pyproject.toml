[project]
name = "harvest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "pandas", "requests", "typer"]

[project.scripts]
harvest = "harvest.cli:app"

# The libraries the program imports, as their stubs: in place of an installed environment.
[tool.ty.environment]
extra-paths = ["../typings"]
