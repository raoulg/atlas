[package]
name = "spend"
version = "0.1.0"
edition = "2021"
description = "Keeps a ledger of expenses and reports them in one currency"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
