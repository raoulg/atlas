[project]
name = "stock"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
stock = "stock.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

# The libraries the program imports, as their stubs: in place of an installed environment.
[tool.ty.environment]
extra-paths = ["../typings"]
