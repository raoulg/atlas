[package]
name = "atlas-engine"
description = "parse: Repo -> Graph, view: Graph -> Graph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
serde_yaml = "0.9"
toml = "1"
regex = "1"
sqlparser = { version = "0.63", features = ["visitor"] }
walkdir = "2"
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
ts-rs = "12"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Python's types, from ty: internal crates of Ruff, pinned together
ty_python_semantic = "=0.0.17"
ty_python_core = "=0.0.17"
ty_module_resolver = "=0.0.17"
ty_vendored = "=0.0.17"
ruff_db = { version = "=0.0.17", features = ["os"] }
ruff_python_ast = "=0.0.17"
ruff_notebook = "=0.0.17"
ruff_text_size = "=0.0.17"
salsa = { version = "0.28.5", features = ["compact_str", "macros", "salsa_unstable", "inventory"] }
