# Git hooks for this repository; `lefthook install` puts them in place, for every worktree.
pre-commit:
  commands:
    # a raised version redraws the documentation's pictures and stops where the text may no longer
    # match them (tools/docs-pictures.sh)
    docs-pictures:
      run: sh tools/docs-pictures.sh
post-commit:
  commands:
    # a raised version, an updated dependency or a new toolchain leave old builds behind
    # (tools/clean-old-builds.sh)
    clean-old-builds:
      run: sh tools/clean-old-builds.sh commit
post-merge:
  commands:
    # a merge or pull can bring an updated dependency or toolchain (tools/clean-old-builds.sh)
    clean-old-builds:
      run: sh tools/clean-old-builds.sh merge
