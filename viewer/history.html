<style>
/*__FONTS__*/
:root{
  --bg:#F4F1EC; --panel:#FFFFFF; --panel-2:#FAF8F5; --ink:#111111; --ink-2:#5A544D; --ink-3:#857D73;
  --line:#E2DCD3; --line-2:#ECE7E0; --alert:#C43A14; --focus:#1D5A73; --accent:#C43A14;
  --hue-1:#1F8A7E; --hue-2:#3F5FCF; --hue-3:#C7862B; --hue-4:#7E56B8; --hue-5:#C44F70; --hue-6:#4E9A4E; --hue-7:#5C6B80; --hue-8:#7D7A72;
  --sans:"Outfit","Helvetica Neue",Helvetica,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141210; --panel:#1B1815; --panel-2:#221E1A; --ink:#F4F1EC; --ink-2:#B8B0A5; --ink-3:#857C71;
  --line:#2B2621; --line-2:#221E1A; --alert:#F2643C; --focus:#86B9C9; --accent:#F2643C;
  --hue-1:#3DB8A9; --hue-2:#7B93E8; --hue-3:#E0A24A; --hue-4:#A98AD9; --hue-5:#E27A96; --hue-6:#77BF77; --hue-7:#8C9BB0; --hue-8:#A39F95;
  --scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141210; --panel:#1B1815; --panel-2:#221E1A; --ink:#F4F1EC; --ink-2:#B8B0A5; --ink-3:#857C71;
  --line:#2B2621; --line-2:#221E1A; --alert:#F2643C; --focus:#86B9C9; --accent:#F2643C;
  --hue-1:#3DB8A9; --hue-2:#7B93E8; --hue-3:#E0A24A; --hue-4:#A98AD9; --hue-5:#E27A96; --hue-6:#77BF77; --hue-7:#8C9BB0; --hue-8:#A39F95;
  --scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden}
#app{display:grid;grid-template-rows:46px minmax(0,1fr);grid-template-columns:var(--hist-w,420px) minmax(0,1fr);height:100vh}
#app.nohist{grid-template-columns:0 minmax(0,1fr)}
#app.nohist #hist{display:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* the top bar */
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0;color-scheme:var(--scheme)}
header .brand{font-weight:500;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
header .brand img{width:22px;height:22px}
header .brand b{font-weight:inherit}
header .brand span{color:var(--ink-3);font-weight:400}
.cmp{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 10px;border:1px solid var(--line);background:var(--panel-2);white-space:nowrap;overflow:hidden}
.cmp .side{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.cmp .h{font-family:var(--mono);font-size:12px;flex:none}
.cmp .s{overflow:hidden;text-overflow:ellipsis;color:var(--ink-2);min-width:0;max-width:280px}
.cmp .side.wt .s{color:var(--ink);font-family:var(--mono);font-size:12px}
.cmp .arrow{color:var(--ink-3);flex:none}
.cmp .alone{color:var(--ink-3);font-size:12px;flex:none}
.badge{display:inline-flex;align-items:center;justify-content:center;flex:none;width:18px;height:18px;border-radius:50%;font:500 11px var(--sans);color:var(--panel);line-height:1}
.badge.a{background:var(--ink-2)} .badge.b{background:var(--focus)}
header .spacer{flex:1}
header .ctl{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:0;padding:3px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
header .ctl:hover{color:var(--ink);border-color:var(--ink-3)}
#histbtn{display:flex;align-items:center;padding:4px 9px;font-family:var(--mono);font-size:12px}
#pick{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:18vh;font-size:13px;color:var(--ink-2)}
#pick[hidden]{display:none}

/* the history */
#hist{position:relative;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;color-scheme:var(--scheme)}
#hist>.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 9px;border-bottom:1px solid var(--line-2)}
#hist>.top b{font-weight:500}
#hist>.top label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:pointer}
#hist>.top input{accent-color:var(--focus);margin:0}
#rows{position:relative;flex:1;min-height:0;overflow:auto;outline:none}
#lanes{position:absolute;left:0;top:0;z-index:1;pointer-events:none}
#lanes path{fill:none;stroke-width:2}
#lanes path.tail{stroke-dasharray:2 3;opacity:.55}
/* a row is 32px high; ROW in the script is the same number */
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;height:32px;padding:0 12px 0 var(--graph-w,40px);cursor:pointer;user-select:none;-webkit-user-select:none}
.row:hover::after{content:"";position:absolute;inset:0;background:color-mix(in oklab, var(--ink) 4%, transparent);pointer-events:none}
.row.range{background:color-mix(in oklab, var(--focus) 7%, transparent)}
.row.sel-a{box-shadow:inset 3px 0 0 var(--ink-2);background:color-mix(in oklab, var(--ink-2) 12%, transparent)}
.row.sel-b{box-shadow:inset 3px 0 0 var(--focus);background:color-mix(in oklab, var(--focus) 16%, transparent)}
.row.cur{outline:1px dashed color-mix(in oklab, var(--ink-3) 70%, transparent);outline-offset:-2px}
#rows:focus .row.cur{outline:1px solid var(--focus)}
.row .msg{min-width:0;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:6px}
/* the subject gives way first, down to a few letters; only then do the pills */
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1 50 auto;min-width:6ch}
.row .hash,.row .when{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-left:10px;white-space:nowrap}
.row .when{min-width:58px;text-align:right}
.row.wt .t{color:var(--ink-3)}
.row.wt .t b{color:var(--ink-2);font-weight:400}
.ref{display:inline-block;flex:none;max-width:min(180px,50%);overflow:hidden;text-overflow:ellipsis;font:11px/16px var(--mono);padding:0 6px;border:1px solid var(--c);color:var(--c);border-radius:2px;white-space:nowrap}
.ref.head{background:var(--c);color:var(--panel)}
.ref.remote{border-color:transparent;background:color-mix(in oklab, var(--c) 15%, transparent)}
.ref i{font-style:normal}
.ref .pre{opacity:.7}
.ref .rm{display:inline-block;margin:0 -6px 0 6px;padding:0 5px;border-left:1px solid var(--c);background:color-mix(in oklab, var(--c) 18%, var(--panel));color:var(--c)}
.ref.tag{--c:var(--ink-2);border-style:dashed}
.ref.later{flex:0 1 auto;min-width:4em}
.ref.extra{--c:var(--ink-3)}
/* the list asks its own width how many pills a row has room for */
#list{container-type:inline-size}
.ref.extra.few{display:none}
@container (max-width:520px){
  .ref.later,.ref.extra.many{display:none}
  .ref.extra.few{display:inline-block}
}
#foot{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 12px 10px var(--graph-w,40px);font-size:12px;color:var(--ink-3)}
#more{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:0;padding:3px 10px;cursor:pointer}
#more:hover{color:var(--ink);border-color:var(--ink-3)}
#more[hidden]{display:none}
.hint{border-top:1px solid var(--line-2);padding:9px 14px 11px;font-size:12px;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;padding:0 5px;background:var(--panel-2);color:var(--ink)}
#resizer{position:absolute;right:-4px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:3}
#resizer:hover,#app.drag #resizer{background:color-mix(in oklab, var(--ink-3) 30%, transparent)}
#app.drag{cursor:col-resize;user-select:none}

/* the picture: the viewer's own page, and a veil over it while a commit is being read */
main{position:relative;min-width:0;min-height:0;background:var(--bg)}
#pic{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg);color-scheme:normal}
#app.drag #pic{pointer-events:none}
#reading{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:18vh;background:color-mix(in oklab, var(--bg) 55%, transparent);z-index:2}
#reading[hidden]{display:none}
#reading .card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.18);padding:12px 18px 14px;font-family:var(--mono);font-size:12px;color:var(--ink-2);max-width:calc(100% - 32px)}
#reading .card b{color:var(--ink);font-weight:400}
#reading .bar{position:absolute;left:0;bottom:0;height:2px;width:35%;background:var(--focus);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){ #reading .bar{animation:none;width:100%;opacity:.5} }

/* a narrow window: the history lies over the picture when it is open, and starts closed */
@media (max-width:760px){
  #app{grid-template-columns:0 minmax(0,1fr)}
  #hist{position:fixed;left:0;top:46px;bottom:0;width:min(var(--hist-w,420px),calc(100vw - 36px));z-index:20;box-shadow:18px 0 40px rgba(0,0,0,.28)}
  #resizer{display:none}
  header{gap:10px;padding:0 10px}
  .hint{display:none}
}
@media (max-width:520px){
  header .brand b,header .brand span,.cmp .s{display:none}
  .cmp .side.wt .s{display:inline}
}

/* what the page shows of B: its picture or its files */
.modes{display:flex;flex:none;border:1px solid var(--line)}
.modes button{font:inherit;font-size:12px;border:0;background:var(--panel);color:var(--ink-2);padding:3px 10px;cursor:pointer}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.cmp .verb{color:var(--ink-3);font-size:12px;flex:none}
#files{position:absolute;inset:0;z-index:3;display:grid;grid-template-columns:minmax(200px,300px) minmax(0,1fr);background:var(--panel)}
#files[hidden]{display:none}
#files .list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#files .find{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line-2)}
#files .find input[type=search]{font:inherit;font-size:12px;padding:4px 7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
#files .find label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
#files .find input[type=checkbox]{accent-color:var(--focus);margin:0}
#fl{flex:1;min-height:0;overflow:auto;padding:4px 0}
#fl button{display:block;width:100%;text-align:left;font:12px/22px var(--mono);border:0;background:none;color:var(--ink);padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#fl button .dir{color:var(--ink-3)}
#fl button:hover{background:color-mix(in oklab, var(--ink) 5%, transparent)}
#fl button[aria-current="true"]{background:color-mix(in oklab, var(--focus) 16%, transparent);box-shadow:inset 3px 0 0 var(--focus)}
#fl .none{padding:8px 12px;font-size:12px;color:var(--ink-3)}
#doc{width:100%;height:100%;border:0;display:block;background:var(--panel)}

/* the menu of a commit, and the question an action asks before it runs */
#menu{position:fixed;z-index:30;min-width:230px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.2);padding:4px 0;color-scheme:var(--scheme)}
#menu[hidden]{display:none}
#menu button{display:flex;justify-content:space-between;gap:18px;width:100%;text-align:left;font:inherit;font-size:13px;border:0;background:none;color:var(--ink);padding:5px 14px;cursor:pointer;white-space:nowrap}
#menu button:hover:not(:disabled),#menu button:focus-visible{background:color-mix(in oklab, var(--focus) 14%, transparent);outline:none}
#menu button:disabled{color:var(--ink-3);cursor:default}
#menu button small{color:var(--ink-3);font:11px var(--mono)}
#menu hr{border:0;border-top:1px solid var(--line-2);margin:4px 0}
#ask{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0;width:min(480px,calc(100vw - 32px));box-shadow:0 18px 50px rgba(0,0,0,.28);color-scheme:var(--scheme)}
#ask::backdrop{background:color-mix(in oklab, var(--bg) 50%, transparent)}
#ask form{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
#ask h2{margin:0;font-size:15px;font-weight:500}
#ask p{margin:0;color:var(--ink-2)}
#ask label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
#ask label.choice{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
#ask input[type=text],#ask textarea{font:13px var(--mono);padding:5px 8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
#ask textarea{min-height:56px;resize:vertical}
#ask .cmd{font:12px var(--mono);background:var(--panel-2);border:1px solid var(--line-2);padding:7px 9px;white-space:pre-wrap;word-break:break-all}
#ask .said{font:12px var(--mono);white-space:pre-wrap;max-height:200px;overflow:auto;margin:0}
#ask .said.bad{color:var(--alert)}
#ask .warn{color:var(--alert)}
#ask .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#ask .buttons button{font:inherit;font-size:13px;padding:4px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
#ask .buttons button.go{background:var(--focus);border-color:var(--focus);color:var(--panel)}
#ask .buttons button:disabled{opacity:.5;cursor:default}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--panel);padding:6px 14px;font-size:12px}
#toast[hidden]{display:none}
</style>
<script>/*__PALETTE__*/</script>

<div id="app">
  <header>
    <a class="ctl" id="live" href="/" title="back to the working tree's page" hidden>✕ close history</a>
    <div class="brand"><img alt=""><b>Atlas</b><span>history</span></div>
    <button class="ctl" id="histbtn" type="button" aria-controls="hist">hide commits</button>
    <div class="cmp" id="cmp" aria-live="polite"></div>
    <div class="modes" role="group" aria-label="what to show of B">
      <button type="button" id="m-picture" aria-pressed="true" title="the Atlas picture">picture</button>
      <button type="button" id="m-files" aria-pressed="false" title="the files of B, markdown rendered">files</button>
    </div>
    <div class="spacer"></div>
    <a class="ctl" id="open" target="_blank" rel="noopener" title="open this picture alone in a new tab">open ↗</a>
  </header>
  <section id="hist" aria-label="history">
    <div class="top"><b>History</b><label><input type="checkbox" id="all"> all branches</label></div>
    <div id="rows" tabindex="0" role="listbox" aria-label="commits">
      <svg id="lanes" aria-hidden="true"></svg>
      <div id="list"></div>
      <div id="foot"><button id="more" type="button" hidden></button><span id="status"></span></div>
    </div>
    <div class="hint">
      <span><kbd>↑</kbd> <kbd>↓</kbd></span><span>move through the history</span>
      <span><kbd>Enter</kbd> · click</span><span>show this commit (B)</span>
      <span><kbd>⇧</kbd> <kbd>Enter</kbd> · <kbd>⇧</kbd> click</span><span>compare it (A) with what is shown (B)</span>
      <span><kbd>Esc</kbd></span><span>B alone</span>
      <span>right-click · <kbd>⇧</kbd> <kbd>F10</kbd></span><span>copy, tag, checkout, push, pull</span>
    </div>
    <div id="resizer" title="drag to resize the history"></div>
  </section>
  <main>
    <iframe id="pic" title="the Atlas picture of A and B"></iframe>
    <div id="files" hidden>
      <div class="list">
        <div class="find"><input type="search" id="ffind" placeholder="find a file" aria-label="find a file"><label><input type="checkbox" id="fmd" checked> markdown only</label></div>
        <div id="fl" role="list"></div>
      </div>
      <iframe id="doc" title="a file of B" sandbox="allow-same-origin"></iframe>
    </div>
    <div id="pick" hidden><div>Pick a commit to see it (click), and a second to compare with it (<kbd>⇧</kbd> click).</div></div>
    <div id="reading" hidden><div class="card"><span id="readwhat"></span><span class="bar"></span></div></div>
  </main>
</div>
<div id="menu" role="menu" hidden></div>
<dialog id="ask"><form method="dialog"></form></dialog>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
const PAGE = 300;   // commits per page of the history
const ROW = 32;     // the height of a row in pixels, as in the CSS
const WT = "worktree";
// a line of descent takes the next of the viewer's hues
const HUES = ["--hue-2", "--hue-5", "--hue-1", "--hue-3", "--hue-4", "--hue-6", "--hue-7"];
const hue = c => `var(${HUES[c % HUES.length]})`;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const $ = id => document.getElementById(id);
const app = $("app"), rowsEl = $("rows"), list = $("list"), svg = $("lanes"), frame = $("pic");
const reading = $("reading"), openLink = $("open"), more = $("more"), statusEl = $("status"), allBox = $("all");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

document.querySelector("header .brand img").src = document.querySelector("link[rel=icon]").href;

// A and B, and the viewer's own hash, live in this page's hash, so a reload keeps them
const own = new URLSearchParams(location.hash.slice(1));
const S = {
  all: store.get("atlas.history.all") !== "0",
  pages: 1,
  log: null,
  rows: [],          // the working tree when it has changes, then the commits, in the order they are drawn
  at: new Map(),     // hash → row; a clean working tree is the row of HEAD
  lay: null,
  known: new Map(),  // every commit seen, so A and B keep their names when their rows are not loaded
  head: null,        // the commit HEAD is at
  dirty: false,      // whether the working tree differs from HEAD
  branch: null,      // HEAD's branch, what it follows, and the git commands that push and pull it
  a: own.get("a") || null,
  b: own.get("b") || WT,
  mode: own.get("m") === "files" ? "files" : "picture",
  file: own.get("f") || null,
  cursor: 0,
  first: true,
};
allBox.checked = S.all;

/* ---- the picture ---- */
// `sent` is the view the picture was asked with, `kept` the view this page's hash holds
let shown = "", sent = own.get("v") || "", kept = sent, settled = false, veil = 0;
// served by `atlas-code serve` beside the working tree's page, the history closes back to it, which the
// browser keeps, and draws nothing before a commit is picked: the working tree is the page just left
const served = location.pathname === "/history", liveEl = document.getElementById("live");
liveEl.hidden = !served;
liveEl.addEventListener("click", e => { if (document.referrer === location.origin + "/" || document.referrer.startsWith(location.origin + "/#")) { e.preventDefault(); history.back(); } });
const viewURL = () => { const q = new URLSearchParams({b: S.b}); if (S.a) q.set("a", S.a); return "/view?" + q; };
// the viewer keeps its view in its own hash; while a picture is on its way, the hash it was sent with stands for it
const viewHash = () => {
  if (!settled) return sent;
  try { return frame.contentWindow.location.hash; } catch { return sent; }
};
const remember = view => {
  const q = new URLSearchParams();
  if (S.a) q.set("a", S.a);
  if (S.b !== WT) q.set("b", S.b);
  if (view) q.set("v", view);
  if (S.mode === "files") q.set("m", "files");
  if (S.mode === "files" && S.file) q.set("f", S.file);
  const s = q.toString();
  try { history.replaceState(null, "", s ? "#" + s : location.pathname + location.search); } catch {}
};
const label = h => {
  if (h === WT) {
    const head = S.known.get(S.head);
    if (!S.log) return {short: "", subject: "working tree"};
    return {short: "", subject: S.dirty ? `working tree · ${treeState(S.log)}` : head ? `working tree, clean at ${head.short}` : "working tree"};
  }
  const c = S.known.get(h);
  return c || {short: h.slice(0, 7), subject: ""};
};
function show() {
  const url = viewURL();
  if (url === shown) return;
  $("pick").hidden = true;
  sent = viewHash(); shown = url; settled = false;
  frame.src = url + sent;
  openLink.href = url + sent;
  remember(kept = sent);
  const what = $("readwhat"); what.replaceChildren("reading ");
  [S.a, S.b].filter(Boolean).forEach((h, i) => {
    if (i) what.append(" and ");
    what.append(el("b", null, h === WT ? "the working tree" : label(h).short));
  });
  what.append("…");
  clearTimeout(veil);
  veil = setTimeout(() => { if (!settled) reading.hidden = false; }, 150);
}
frame.addEventListener("load", () => {
  try { if (frame.contentWindow.location.href === "about:blank") return; } catch {}
  settled = true; clearTimeout(veil); reading.hidden = true;
});
const freshen = () => { openLink.href = shown + viewHash(); };
for (const ev of ["pointerenter", "focus", "click"]) openLink.addEventListener(ev, freshen);
// the viewer writes its view with replaceState, which raises no event: the page looks once a second,
// so that a reload finds the reader where they were
setInterval(() => {
  if (!settled || document.hidden) return;
  const v = viewHash();
  if (v !== kept) remember(kept = v);
}, 1000);

/* ---- the lanes ----
   One lane per line of descent. The rows come children first; a slot of `lanes` holds a line that waits
   for a commit further down (`want`), in the colour of its line, leaving the row above from lane `from`.
   A commit takes the lane of a line that waits for it, preferring one that reaches it as a first parent,
   and the other lines that wait for it bend into it there. Its first parent continues its lane; a further
   parent joins the line that already waits for it, or starts a new line in a free slot to its right.
   A line whose commit lies beyond the loaded rows runs off the bottom. */
function layout(rows) {
  const n = rows.length, nodes = new Array(n), segs = [];
  let lanes = [], joins = [], next = 0, width = 1;
  const free = from => { let k = from; while (k < lanes.length && lanes[k]) k++; return k; };
  for (let i = 0; i < n; i++) {
    const c = rows[i], waiting = [];
    lanes.forEach((l, k) => { if (l && l.want === c.hash) waiting.push(k); });
    const lane = waiting.length ? (waiting.find(k => lanes[k].first) ?? waiting[0]) : free(0);
    const color = waiting.length ? lanes[lane].color : next++;
    nodes[i] = {lane, color};
    if (i > 0) {
      lanes.forEach((l, k) => { if (l) segs.push({r: i - 1, x1: l.from, x2: l.want === c.hash ? lane : k, color: l.color}); });
      for (const j of joins) segs.push({r: i - 1, x1: j.from, x2: j.want === c.hash ? lane : j.to, color: j.color});
    }
    joins = [];
    for (const k of waiting) lanes[k] = null;
    lanes.forEach((l, k) => { if (l) l.from = k; });
    [...new Set(c.parents || [])].forEach((p, j) => {
      if (j === 0) { lanes[lane] = {want: p, color, first: true, from: lane}; return; }
      const m = lanes.findIndex(l => l && l.want === p);
      if (m >= 0) { joins.push({want: p, from: lane, to: m, color: lanes[m].color}); return; }
      lanes[free(lane + 1)] = {want: p, color: next++, first: false, from: lane};
    });
    while (lanes.length && !lanes[lanes.length - 1]) lanes.pop();
    width = Math.max(width, lanes.length, lane + 1);
  }
  lanes.forEach((l, k) => { if (l) segs.push({r: n - 1, x1: l.from, x2: k, color: l.color, tail: true}); });
  for (const j of joins) segs.push({r: n - 1, x1: j.from, x2: j.to, color: j.color, tail: true});
  return {nodes, segs, width};
}

let X = k => 14 + k * 16;
const Y = i => i * ROW + ROW / 2;
function drawLanes() {
  const {nodes, segs, width} = S.lay, n = S.rows.length;
  const sp = Math.max(8, Math.min(16, Math.floor(150 / width)));
  X = k => 14 + k * sp;
  const graphW = Math.min(X(width - 1) + 16, 260);
  rowsEl.style.setProperty("--graph-w", graphW + "px");
  svg.setAttribute("width", graphW);
  svg.setAttribute("height", n * ROW + ROW);
  svg.replaceChildren();
  // one path per colour, and one per colour for the lines that run off the bottom
  const paths = new Map();
  for (const s of segs) {
    const key = (s.color % HUES.length) + (s.tail ? "t" : "");
    const x1 = X(s.x1), x2 = X(s.x2), y1 = Y(s.r), y2 = s.tail ? y1 + ROW : Y(s.r + 1), ym = (y1 + y2) / 2;
    const d = x1 === x2 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}C${x1} ${ym} ${x2} ${ym} ${x2} ${y2}`;
    paths.set(key, (paths.get(key) || "") + d);
  }
  for (const [key, d] of paths) sv("path", {d, class: key.endsWith("t") ? "tail" : "", style: `stroke:${hue(parseInt(key, 10))}`}, svg);
  sv("g", {id: "rings"}, svg);
  // HEAD is a hollow dot in its line's colour; the uncommitted changes above it a grey one
  nodes.forEach((nd, i) => {
    const wt = S.rows[i].hash === WT, head = S.rows[i].hash === S.head;
    sv("circle", {cx: X(nd.lane), cy: Y(i), r: wt || head ? 5 : 4.5, "data-i": i,
      style: wt ? "fill:var(--panel);stroke:var(--ink-3);stroke-width:2"
        : head ? `fill:var(--panel);stroke:${hue(nd.color)};stroke-width:2.5`
        : `fill:${hue(nd.color)};stroke:var(--panel);stroke-width:1.5`}, svg);
  });
}

/* ---- the rows ---- */
function when(t) {
  if (t == null) return "";
  const d = new Date(t * 1000), now = new Date(), s = (now - d) / 1000;
  if (s < 60) return "now";
  if (s < 3600) return Math.floor(s / 60) + " min";
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((day(now) - day(d)) / 864e5);
  if (days === 0) return Math.floor(s / 3600) + " h";
  if (days === 1) return "yest.";
  if (d.getFullYear() === now.getFullYear()) return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
// the working tree's state: `dirty` is a flag or a count of files; a count may also come as `changed`
function treeState(log) {
  const count = typeof log.dirty === "number" ? log.dirty
    : typeof log.changed === "number" ? log.changed
    : Array.isArray(log.changed) ? log.changed.length : null;
  if (!log.dirty && !count) return "clean";
  if (count == null) return "uncommitted changes";
  return count === 1 ? "1 file changed" : `${count} files changed`;
}
const KIND = {head: 0, branch: 1, remote: 2, tag: 3};
const KIND_NAME = {head: "HEAD's branch", branch: "branch", remote: "remote branch", tag: "tag"};
// A commit's refs as pills: HEAD's branch, then branches, remotes and tags. A remote that carries a branch
// of the same commit rides in that branch's pill. A narrow history shows the first pill and "+n".
function pills(c, color) {
  const rs = (c.refs || []).filter(r => !(r.kind === "remote" && /\/HEAD$/.test(r.name)));
  const heads = new Set(rs.filter(r => r.kind === "head").map(r => r.name));
  const own = rs.filter(r => !(r.kind === "branch" && heads.has(r.name)));
  const local = new Map(own.filter(r => r.kind === "head" || r.kind === "branch").map(r => [r.name, []]));
  const refs = [];
  for (const r of own) {
    const cut = r.kind === "remote" ? r.name.indexOf("/") : -1;
    if (cut > 0 && local.has(r.name.slice(cut + 1))) local.get(r.name.slice(cut + 1)).push(r.name.slice(0, cut));
    else refs.push(r);
  }
  refs.sort((x, y) => (KIND[x.kind] ?? 4) - (KIND[y.kind] ?? 4));
  const out = refs.slice(0, 3).map((r, i) => {
    const e = el("span", "ref " + r.kind + (i ? " later" : ""));
    e.style.setProperty("--c", hue(color));
    const cut = r.kind === "remote" ? r.name.indexOf("/") : -1;
    const remotes = r.kind === "head" || r.kind === "branch" ? local.get(r.name) : [];
    if (cut > 0) e.append(el("i", "pre", r.name.slice(0, cut + 1)), r.name.slice(cut + 1));
    else e.append(r.name);
    for (const rm of remotes) e.append(el("i", "rm", rm));
    e.title = `${KIND_NAME[r.kind] || r.kind} ${r.name}` + (remotes.length ? `, as ${remotes.map(rm => rm + "/" + r.name).join(" and ")}` : "");
    return e;
  });
  const extra = (from, cls) => {
    const e = el("span", "ref extra " + cls, "+" + (refs.length - from));
    e.title = refs.slice(from).map(r => r.name).join("\n");
    return e;
  };
  if (refs.length > 1) out.push(extra(1, "few"));
  if (refs.length > 3) out.push(extra(3, "many"));
  return out;
}
function drawRows() {
  const frag = document.createDocumentFragment();
  S.rows.forEach((c, i) => {
    const r = el("div", "row"), msg = el("span", "msg");
    r.id = "r" + i; r.dataset.i = i; r.setAttribute("role", "option");
    msg.appendChild(el("span"));
    if (c.hash === WT) {
      r.classList.add("wt");
      const t = el("span", "t"); t.append(el("b", null, "Uncommitted changes"), " · " + treeState(S.log));
      msg.appendChild(t);
      r.append(msg, el("span", "hash"), el("span", "when", "now"));
      r.title = "the working tree: what HEAD's commit does not hold yet";
    } else {
      msg.append(...pills(c, S.lay.nodes[i].color), el("span", "t", c.subject));
      r.append(msg, el("span", "hash", c.short), el("span", "when", when(c.time)));
      const head = c.hash === S.head ? `HEAD: the working tree stands on this commit${S.dirty ? ", with the changes above" : ", and is clean"}\n` : "";
      r.title = `${head}${c.hash}\n${c.author} · ${new Date(c.time * 1000).toLocaleString()}\n\n${c.subject}`;
    }
    frag.appendChild(r);
  });
  list.replaceChildren(frag);
}

/* ---- A, B and the cursor ---- */
const ancestors = i => {
  const seen = new Set([i]), todo = [i];
  while (todo.length) for (const p of S.rows[todo.pop()].parents || []) {
    const k = S.at.get(p);
    if (k !== undefined && !seen.has(k)) { seen.add(k); todo.push(k); }
  }
  return seen;
};
// the rows between A and B: the commits one of them reaches and the other does not
function between(ia, ib) {
  const out = new Set();
  if (ia === undefined || ib === undefined) return out;
  const A = ancestors(ia), B = ancestors(ib);
  for (const k of B) if (!A.has(k)) out.add(k);
  for (const k of A) if (!B.has(k)) out.add(k);
  out.delete(ia); out.delete(ib);
  return out;
}
function side(h, which) {
  const s = el("span", "side" + (h === WT ? " wt" : "")), l = label(h);
  s.appendChild(el("span", "badge " + which, which.toUpperCase()));
  if (l.short) s.appendChild(el("span", "h", l.short));
  s.appendChild(el("span", "s", l.subject));
  s.title = h === WT ? "the working tree" : `${h}\n${l.subject || ""}`;
  return s;
}
function paint() {
  const ia = S.a ? S.at.get(S.a) : undefined, ib = S.at.get(S.b), tint = between(ia, ib);
  Array.prototype.forEach.call(list.children, (r, i) => {
    const a = i === ia, b = i === ib, slot = r.firstChild.firstChild;
    r.classList.toggle("sel-a", a);
    r.classList.toggle("sel-b", b);
    r.classList.toggle("range", tint.has(i));
    r.setAttribute("aria-selected", a || b ? "true" : "false");
    slot.className = a ? "badge a" : b ? "badge b" : "";
    slot.textContent = a ? "A" : b ? "B" : "";
  });
  const rings = svg.querySelector("#rings");
  if (rings) {
    rings.replaceChildren();
    for (const [i, color] of [[ia, "var(--ink-2)"], [ib, "var(--focus)"]]) if (i !== undefined)
      sv("circle", {cx: X(S.lay.nodes[i].lane), cy: Y(i), r: 8, style: `fill:none;stroke:${color};stroke-width:2`}, rings);
  }
  const cmp = $("cmp");
  cmp.replaceChildren();
  if (S.a) cmp.append(el("span", "verb", "comparing"), side(S.a, "a"), el("span", "arrow", "→"), side(S.b, "b"));
  else cmp.append(el("span", "verb", "showing"), side(S.b, "b"));
  const name = h => h === WT ? "working tree" : label(h).short;
  document.title = S.a ? `${name(S.a)} → ${name(S.b)} · Atlas history` : S.b === WT ? "Atlas history" : `${name(S.b)} · Atlas history`;
}
// a row's revision: a clean working tree is HEAD's commit, and its row stands for both
const rowRev = i => { const h = S.rows[i].hash; return !S.dirty && h === S.head ? WT : h; };
function cursorTo(i, scroll) {
  const old = list.children[S.cursor];
  if (old) old.classList.remove("cur");
  S.cursor = i;
  const r = list.children[i];
  if (!r) return;
  r.classList.add("cur");
  rowsEl.setAttribute("aria-activedescendant", r.id);
  if (scroll) r.scrollIntoView({block: "nearest"});
}
function pick(a, b) {
  S.b = b;
  S.a = a === b ? null : a;
  paint(); present();
}

// keys act while the history (or nothing) has the focus; inside the picture they are the viewer's
document.addEventListener("keydown", e => {
  if (e.target !== rowsEl && e.target !== document.body) return;
  if (e.ctrlKey || e.metaKey || e.altKey || !S.rows.length || app.classList.contains("nohist")) return;
  const n = S.rows.length, page = Math.max(1, Math.floor(rowsEl.clientHeight / ROW) - 1);
  if (e.key === "ContextMenu" || (e.key === "F10" && e.shiftKey)) {
    const box = list.children[S.cursor].getBoundingClientRect();
    openMenu(S.cursor, box.left + 40, box.bottom);
    e.preventDefault();
    return;
  }
  let to;
  switch (e.key) {
    case "ArrowDown": to = S.cursor + 1; break;
    case "ArrowUp": to = S.cursor - 1; break;
    case "PageDown": to = S.cursor + page; break;
    case "PageUp": to = S.cursor - page; break;
    case "Home": to = 0; break;
    case "End": to = n - 1; break;
    case "Enter": {
      const h = rowRev(S.cursor);
      if (e.shiftKey) pick(h, S.b);
      else pick(null, h);
      e.preventDefault();
      return;
    }
    case "Escape":
      if (S.a) pick(null, S.b);
      e.preventDefault();
      return;
    default: return;
  }
  e.preventDefault();

});
list.addEventListener("click", e => {
  const r = e.target.closest(".row");
  if (!r) return;
  const i = +r.dataset.i, h = rowRev(i);
  cursorTo(i, false);
  rowsEl.focus({preventScroll: true});
  // a click shows a revision on its own; a ⇧ click compares it, as A, with the one shown
  if (e.shiftKey) pick(h, S.b);
  else pick(null, h);
});
list.addEventListener("contextmenu", e => {
  const r = e.target.closest(".row");
  if (!r) return;
  e.preventDefault();
  cursorTo(+r.dataset.i, false);
  openMenu(+r.dataset.i, e.clientX, e.clientY);
});

/* ---- B's files: read from its commit, markdown rendered by the server ---- */
const filesEl = $("files"), fl = $("fl"), doc = $("doc"), ffind = $("ffind"), fmd = $("fmd");
let filesOf = null, fileList = [], docShown = "";
const isMd = p => /\.(md|markdown)$/i.test(p);
function present() {
  filesEl.hidden = S.mode !== "files";
  $("m-picture").setAttribute("aria-pressed", S.mode === "picture" ? "true" : "false");
  $("m-files").setAttribute("aria-pressed", S.mode === "files" ? "true" : "false");
  if (S.mode === "files") { $("pick").hidden = true; reading.hidden = true; files(); }
  else show();
  remember(kept);
}
for (const [id, mode] of [["m-picture", "picture"], ["m-files", "files"]])
  $(id).addEventListener("click", () => { S.mode = mode; present(); });
async function files() {
  const rev = S.b;
  // a commit's files stay as they are; the working tree's are read again
  if (filesOf !== rev || rev === WT) {
    filesOf = rev;
    if (!fileList.length) fl.replaceChildren(el("div", "none", "reading the files…"));
    let got;
    try {
      const r = await fetch(`/api/tree?rev=${encodeURIComponent(rev)}`);
      if (!r.ok) throw new Error((await r.text()) || r.status);
      got = (await r.json()).files || [];
    } catch (err) {
      if (filesOf === rev) { filesOf = null; fl.replaceChildren(el("div", "none", "the files could not be read: " + err.message)); }
      return;
    }
    if (filesOf !== rev || S.mode !== "files") return;
    fileList = got; docShown = "";
  }
  const want = S.file && fileList.includes(S.file) ? S.file
    : fileList.find(f => /^readme\.md$/i.test(f)) || fileList.find(isMd) || fileList[0] || null;
  openFile(want);
}
function listFiles() {
  const find = ffind.value.trim().toLowerCase(), only = fmd.checked;
  const shown = fileList.filter(p => (!only || isMd(p)) && (!find || p.toLowerCase().includes(find)));
  const frag = document.createDocumentFragment();
  for (const p of shown.slice(0, 2000)) {
    const b = el("button"), cut = p.lastIndexOf("/");
    b.type = "button"; b.dataset.path = p; b.title = p;
    if (cut >= 0) b.append(el("span", "dir", p.slice(0, cut + 1)));
    b.append(p.slice(cut + 1));
    if (p === S.file) b.setAttribute("aria-current", "true");
    frag.appendChild(b);
  }
  if (!shown.length) frag.appendChild(el("div", "none", fileList.length ? "no file matches" : "no files"));
  if (shown.length > 2000) frag.appendChild(el("div", "none", `${shown.length - 2000} more: narrow the search`));
  fl.replaceChildren(frag);
}
function openFile(p) {
  S.file = p;
  remember(kept);
  listFiles();
  const url = p ? `/file?rev=${encodeURIComponent(S.b)}&path=${encodeURIComponent(p)}` : "about:blank";
  if (url !== docShown) { docShown = url; doc.src = url; }
}
fl.addEventListener("click", e => { const b = e.target.closest("button[data-path]"); if (b) openFile(b.dataset.path); });
ffind.addEventListener("input", listFiles);
fmd.addEventListener("change", listFiles);
// the file's page runs no script: this page hands it the theme, and follows its links
const theme = () => {
  let d; try { d = doc.contentDocument; } catch { return; }
  if (!d || !d.documentElement) return;
  const root = document.documentElement;
  if (root.dataset.theme) d.documentElement.dataset.theme = root.dataset.theme;
  else delete d.documentElement.dataset.theme;
  d.documentElement.style.cssText = root.style.cssText;
};
new MutationObserver(theme).observe(document.documentElement, {attributes: true, attributeFilter: ["style", "data-theme"]});
doc.addEventListener("load", () => {
  theme();
  let d; try { d = doc.contentDocument; } catch { return; }
  if (!d) return;
  d.addEventListener("click", e => {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    const href = a.getAttribute("href");
    if (href.startsWith("#")) return;
    e.preventDefault();
    if (href.startsWith("/file?")) { const p = new URLSearchParams(href.slice(6).split("#")[0]).get("path"); if (p) openFile(p); return; }
    window.open(a.href, "_blank", "noopener");
  });
});

/* ---- the menu of a row, and what its actions ask first ---- */
const menu = $("menu"), ask = $("ask"), toastEl = $("toast");
let toastTimer = 0;
function toast(text) {
  toastEl.textContent = text; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 1800);
}
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = el("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); } finally { t.remove(); }
  }
  toast("copied " + what);
}
const plural = (n, one) => `${n} ${one}${n === 1 ? "" : "s"}`;
function closeMenu(focus) {
  if (menu.hidden) return;
  menu.hidden = true;
  if (focus) rowsEl.focus({preventScroll: true});
}
function openMenu(i, x, y) {
  const row = S.rows[i], rev = rowRev(i), c = row.hash === WT ? null : row, b = S.branch || {};
  const items = [];
  const item = (text, hint, act, off) => {
    const btn = el("button");
    btn.type = "button"; btn.setAttribute("role", "menuitem");
    btn.append(el("span", null, text));
    if (hint) btn.append(el("small", null, hint));
    btn.disabled = !!off;
    btn.addEventListener("click", () => { closeMenu(false); act(); });
    items.push(btn);
  };
  const line = () => { if (items.length && items[items.length - 1].tagName !== "HR") items.push(el("hr")); };
  item(rev === WT ? "Show the working tree" : "Show this commit", "click", () => pick(null, rev));
  if (rev !== WT) item("Compare with the working tree", "", () => pick(rev, WT));
  if (S.b !== rev && S.b !== WT) item(`Compare with ${label(S.b).short}`, "⇧ click", () => pick(rev, S.b));
  if (c) {
    line();
    item("Copy commit hash", c.short, () => copy(c.hash, c.hash));
    item("Copy subject", "", () => copy(c.subject, "the subject"));
    line();
    item("Add tag…", "", () => tagAsk(c));
    item("Checkout…", "", () => checkoutAsk(c));
  }
  line();
  const name = b.name || "HEAD";
  item(b.pull ? `Pull ${name}` : "Pull", b.pull ? (b.behind ? `${b.behind} behind ${b.upstream}` : `from ${b.upstream}`) : b.name ? "no upstream" : "no branch", pullAsk, !b.pull);
  item(b.push ? `Push ${name}` : "Push", b.push ? (b.upstream ? (b.ahead ? `${b.ahead} ahead of ${b.upstream}` : `to ${b.upstream}`) : `to ${b.push[2]}`) : b.name ? "no remote" : "no branch", pushAsk, !b.push);
  menu.replaceChildren(...items);
  menu.hidden = false;
  menu.style.left = Math.max(4, Math.min(x, innerWidth - menu.offsetWidth - 4)) + "px";
  menu.style.top = Math.max(4, Math.min(y, innerHeight - menu.offsetHeight - 4)) + "px";
  menu.querySelector("button:not(:disabled)")?.focus();
}
menu.addEventListener("keydown", e => {
  const all = [...menu.querySelectorAll("button:not(:disabled)")], at = all.indexOf(document.activeElement);
  if (e.key === "Escape" || e.key === "Tab") { closeMenu(true); e.preventDefault(); }
  else if (e.key === "ArrowDown") { all[(at + 1) % all.length]?.focus(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { all[(at - 1 + all.length) % all.length]?.focus(); e.preventDefault(); }
  e.stopPropagation();
});
document.addEventListener("pointerdown", e => { if (!menu.contains(e.target)) closeMenu(false); }, true);
for (const ev of ["resize", "blur"]) window.addEventListener(ev, () => closeMenu(false));
rowsEl.addEventListener("scroll", () => closeMenu(false));

// a word of a git command as a shell would want it
const quote = s => /^[\w./@:+=,-]+$/.test(s) ? s : "'" + s.replace(/'/g, "'\\''") + "'";
// Ask before running git: what it does, the fields it needs, and the command it runs, which `args`
// gives (none while a field is missing). The server runs only the commands this page offers.
function question(title, intro, body, args) {
  const f = el("form"), cmd = el("div", "cmd"), said = el("pre", "said");
  const cancel = el("button", null, "Cancel"), go = el("button", "go", "Run"), buttons = el("div", "buttons");
  cancel.type = go.type = "button";
  said.hidden = true;
  buttons.append(cancel, go);
  f.append(el("h2", null, title), ...intro, ...body, el("p", null, "Runs:"), cmd, said, buttons);
  const update = () => {
    const a = args();
    cmd.textContent = a ? "git " + a.map(quote).join(" ") : "…";
    go.disabled = !a;
  };
  f.addEventListener("input", update);
  f.addEventListener("change", update);
  f.addEventListener("submit", e => { e.preventDefault(); if (go.isConnected && !go.disabled) go.click(); });
  cancel.addEventListener("click", () => ask.close());
  go.addEventListener("click", async () => {
    const a = args();
    if (!a) return;
    go.disabled = cancel.disabled = true; go.textContent = "running…";
    let ok = false, text;
    try {
      const r = await fetch("/api/git", {method: "POST", headers: {"content-type": "application/json", "x-atlas": "1"}, body: JSON.stringify({run: a})});
      text = await r.text(); ok = r.ok;
      if (ok) text = JSON.parse(text).said || "done";
    } catch (err) { text = err.message; }
    for (const x of f.querySelectorAll("input,textarea")) x.disabled = true;
    said.hidden = false; said.textContent = text; said.classList.toggle("bad", !ok);
    go.remove(); cancel.disabled = false; cancel.textContent = "Close"; cancel.focus();
    if (ok) toast(title.replace(/…$/, "") + ": done");
    load(true);
  });
  update();
  ask.replaceChildren(f);
  ask.showModal();
  (f.querySelector("input:not([type=radio]),textarea") || f.querySelector("input:checked") || go).focus();
}
const field = (text, input) => { const l = el("label", null, text); l.appendChild(input); return l; };
function tagAsk(c) {
  const name = el("input"), msg = el("textarea");
  name.type = "text"; name.placeholder = "v1.2.0"; name.autocomplete = "off"; name.spellcheck = false;
  msg.placeholder = "optional: with a message the tag is annotated";
  question(`Add a tag to ${c.short}`, [el("p", null, c.subject)],
    [field("name", name), field("message", msg), el("p", null, "The tag stays on this machine until it is pushed (git push origin <name>).")],
    () => {
      const n = name.value.trim(), m = msg.value.trim();
      if (!n || n.startsWith("-") || /[\s~^:?*[\\]|\.\.|@\{/.test(n)) return null;
      return m ? ["tag", "-a", n, "-m", m, c.hash] : ["tag", n, c.hash];
    });
}
function checkoutAsk(c) {
  const refs = (c.refs || []).filter(r => r.name !== "HEAD" && !/\/HEAD$/.test(r.name));
  const locals = refs.filter(r => r.kind === "head" || r.kind === "branch").map(r => r.name);
  const options = locals.map(n => ({text: `the branch ${n}` + (n === S.branch?.name ? " (checked out)" : ""), args: ["switch", n], off: n === S.branch?.name}));
  for (const r of refs.filter(r => r.kind === "remote")) {
    const short = r.name.slice(r.name.indexOf("/") + 1);
    if (!locals.includes(short)) options.push({text: `a new branch ${short}, following ${r.name}`, args: ["switch", "--track", r.name]});
  }
  options.push({text: `the commit itself (a detached HEAD at ${c.short})`, args: ["switch", "--detach", c.hash], off: !S.dirty && c.hash === S.head && !S.branch?.name});
  const first = options.find(o => !o.off);
  const radios = options.map((o, k) => {
    const r = el("input"), l = el("label", "choice");
    r.type = "radio"; r.name = "to"; r.value = k; r.disabled = !!o.off; r.checked = o === first;
    l.append(r, o.text);
    return l;
  });
  const intro = [el("p", null, c.subject)];
  if (S.dirty) intro.push(el("p", "warn", `The working tree has uncommitted changes (${treeState(S.log)}): git carries them over where they do not conflict with ${c.short}, and refuses otherwise.`));
  question(`Check out ${c.short}`, intro, [el("p", null, "Switch the working tree to"), ...radios], () => {
    const k = radios.findIndex(l => l.firstChild.checked);
    return k >= 0 ? options[k].args : null;
  });
}
function pullAsk() {
  const b = S.branch;
  if (!b?.pull) return;
  question(`Pull ${b.name}`, [el("p", null, `Fetches ${b.upstream} and moves ${b.name} forward to it, when ${b.name} has no commits of its own that ${b.upstream} lacks; git refuses otherwise.` + (b.behind ? ` As far as the last fetch knew, ${b.name} is ${plural(b.behind, "commit")} behind.` : ""))], [], () => b.pull);
}
function pushAsk() {
  const b = S.branch;
  if (!b?.push) return;
  const to = b.upstream || `${b.push[2]}/${b.name}`;
  const intro = [el("p", null, b.upstream ? `Sends ${b.name}'s ${plural(b.ahead, "commit")} that ${b.upstream} lacks to it.` : `Sends ${b.name} to ${b.push[2]}, and makes it follow ${to}.`)];
  if (/^(main|master)$/.test(b.name)) intro.push(el("p", "warn", `This pushes to ${b.name}.`));
  question(`Push ${b.name}`, intro, [], () => b.push);
}

/* ---- reading the history ---- */
// `quiet`: a look whether git moved (a commit, a push, a fetch, a checkout), which redraws only what differs
let asked = 0, read = "", asking = false;
async function load(quiet) {
  if (quiet && asking) return;
  const n = PAGE * S.pages, ask = ++asked;
  if (!quiet) { asking = true; more.disabled = true; statusEl.textContent = "reading the history…"; }
  let log, text;
  try {
    const r = await fetch(`/api/log?all=${S.all ? 1 : 0}&n=${n}`);
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`.trim());
    text = await r.text();
    log = JSON.parse(text);
  } catch (err) {
    if (ask === asked && !quiet) { asking = false; statusEl.textContent = "the history could not be read: " + err.message; more.disabled = false; }
    return;
  }
  if (ask === asked && !quiet) asking = false;
  if (ask !== asked || (quiet && text === read)) return;
  read = text;
  const commits = log.commits || [];
  for (const c of commits) S.known.set(c.hash, c);
  const keep = S.rows[S.cursor] ? S.rows[S.cursor].hash : null;
  S.log = log;
  S.head = log.head || null;
  S.dirty = !!log.dirty || !commits.length;
  S.branch = log.branch || null;
  // the working tree has a row of its own only when it holds what HEAD's commit does not
  const tree = {hash: WT, parents: log.head ? [log.head] : [], refs: [], subject: "", time: null};
  S.rows = S.dirty ? [tree, ...commits] : commits;
  S.at = new Map(S.rows.map((c, i) => [c.hash, i]));
  if (!S.dirty) S.at.set(WT, S.at.get(S.head));
  S.lay = layout(S.rows);
  drawLanes();
  drawRows();
  paint();
  const at = S.first ? (S.a && S.at.get(S.a)) : S.at.get(keep);
  cursorTo(at ?? 0, S.first);
  more.hidden = commits.length < n;
  more.disabled = false;
  more.textContent = `${PAGE} more`;
  statusEl.textContent = commits.length < n ? (commits.length ? "the first commit" : "no commits yet") : "";
  if (S.first) { S.first = false; rowsEl.focus({preventScroll: true}); }
}
more.addEventListener("click", () => { S.pages++; more.textContent = "reading…"; load(); });
allBox.addEventListener("change", () => {
  S.all = allBox.checked; S.pages = 1;
  store.set("atlas.history.all", S.all ? "1" : "0");
  load();
});

/* ---- the layout: a resizable history, closed by default in a narrow window ---- */
{ const rz = $("resizer"); let drag = false;
  const saved = parseInt(store.get("atlas.history.width"), 10);
  if (saved > 0) app.style.setProperty("--hist-w", saved + "px");
  rz.addEventListener("pointerdown", e => { drag = true; rz.setPointerCapture(e.pointerId); app.classList.add("drag"); e.preventDefault(); });
  rz.addEventListener("pointermove", e => {
    if (!drag) return;
    const w = Math.round(Math.max(260, Math.min(window.innerWidth - 320, e.clientX)));
    app.style.setProperty("--hist-w", w + "px");
  });
  const end = () => {
    if (!drag) return;
    drag = false; app.classList.remove("drag");
    store.set("atlas.history.width", parseInt(getComputedStyle(app).getPropertyValue("--hist-w"), 10) || "");
  };
  rz.addEventListener("pointerup", end);
  rz.addEventListener("pointercancel", end); }
{ const btn = $("histbtn"), narrow = window.matchMedia("(max-width: 760px)");
  let wide = store.get("atlas.history.open") !== "0", small = false;
  const apply = () => {
    const open = narrow.matches ? small : wide;
    app.classList.toggle("nohist", !open);
    btn.textContent = open ? "hide commits" : "show commits";
    btn.title = open ? "hide the list of commits" : "show the list of commits";
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  };
  btn.addEventListener("click", () => {
    if (narrow.matches) small = !small;
    else { wide = !wide; store.set("atlas.history.open", wide ? "1" : "0"); }
    apply();
    if (!app.classList.contains("nohist")) rowsEl.focus({preventScroll: true});
  });
  narrow.addEventListener("change", () => { small = false; apply(); });
  apply(); }

paint();
if (S.mode === "files") present();
else if (served && !own.get("a") && !own.get("b")) $("pick").hidden = false;
else show();
load();
// git changes beside the page: while it is in view, it looks every few seconds and whenever it comes back
{ let looking = false;
  const look = async () => {
    if (document.hidden || looking || S.first) return;
    looking = true;
    try { await load(true); } finally { looking = false; }
  };
  setInterval(look, 3000);
  document.addEventListener("visibilitychange", look);
  window.addEventListener("focus", look); }
})();
</script>
