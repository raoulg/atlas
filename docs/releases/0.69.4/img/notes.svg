<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" role="img" aria-label="How Studio's What's New reaches a release's notes: in 0.69.3 it asks raoulg.github.io, which answers with a redirect to http://atlas.pttrn.io, a page the window does not load, so the window stays empty; in 0.69.4 it asks https://atlas.pttrn.io, which answers 200 with the page, and a redirect anywhere sends Studio to the release on GitHub instead">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-3)"/></marker>
  </defs>
  <g style="font-family:var(--sans);font-size:15px;fill:var(--ink-2)">
    <text x="20" y="34">0.69.3</text>
    <text x="20" y="144" style="fill:var(--ink)">0.69.4</text>
  </g>
  <g style="stroke:var(--line);stroke-width:1"><line x1="20" y1="104" x2="900" y2="104"/></g>
  <g style="stroke:var(--ink-3);stroke-width:1.5;fill:none" marker-end="url(#head)">
    <line x1="138" y1="64" x2="168" y2="64"/>
    <line x1="470" y1="64" x2="500" y2="64"/>
    <line x1="772" y1="64" x2="802" y2="64"/>
    <line x1="138" y1="174" x2="168" y2="174"/>
    <line x1="470" y1="174" x2="500" y2="174"/>
  </g>
  <g style="font-family:var(--mono);font-size:13px;fill:var(--ink)">
    <rect x="20" y="46" width="116" height="36" rx="5" style="fill:var(--panel);stroke:var(--line)"/>
    <text x="78" y="69" style="text-anchor:middle">What's New</text>
    <text x="176" y="69">raoulg.github.io/atlas/…</text>
    <text x="508" y="60" style="fill:var(--del)">301 → http://</text>
    <text x="508" y="78" style="fill:var(--del)">atlas.pttrn.io/…</text>
    <rect x="810" y="46" width="90" height="36" rx="5" style="fill:none;stroke:var(--del);stroke-dasharray:4 3"/>
    <text x="855" y="69" style="text-anchor:middle;fill:var(--del)">empty</text>

    <rect x="20" y="156" width="116" height="36" rx="5" style="fill:var(--panel);stroke:var(--line)"/>
    <text x="78" y="179" style="text-anchor:middle">What's New</text>
    <text x="176" y="179">https://atlas.pttrn.io/…</text>
    <text x="508" y="179" style="fill:var(--add)">200</text>
    <rect x="560" y="156" width="110" height="36" rx="5" style="fill:var(--panel);stroke:var(--add)"/>
    <text x="615" y="179" style="text-anchor:middle;fill:var(--add)">the notes</text>
    <text x="176" y="218" style="fill:var(--ink-3)">any other answer, a redirect too: the release on GitHub, in the browser</text>
  </g>
</svg>
