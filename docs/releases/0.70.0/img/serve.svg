<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 392" role="img" aria-label="What atlas serve and atlas mcp do with shared notes and with requests, in 0.69.2 and 0.70.0">
  <g style="font-family:var(--sans);font-size:15px;fill:var(--ink-2)">
    <text x="20" y="34">the page, the agent, and a request</text>
    <text x="540" y="34" style="text-anchor:middle">0.69.2</text>
    <text x="790" y="34" style="text-anchor:middle;fill:var(--ink)">0.70.0</text>
  </g>
  <g style="stroke:var(--line);stroke-width:1">
    <line x1="20" y1="52" x2="920" y2="52"/>
    <line x1="20" y1="98" x2="920" y2="98"/>
    <line x1="20" y1="144" x2="920" y2="144"/>
    <line x1="20" y1="190" x2="920" y2="190"/>
    <line x1="20" y1="236" x2="920" y2="236"/>
    <line x1="20" y1="282" x2="920" y2="282"/>
    <line x1="20" y1="328" x2="920" y2="328"/>
    <line x1="20" y1="374" x2="920" y2="374"/>
  </g>
  <text x="20" y="82" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">two notes written at once</text>
  <text x="540" y="82" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">one may be lost</text>
  <text x="790" y="82" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">both kept</text>
  <text x="20" y="128" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">notes.json that does not read</text>
  <text x="540" y="128" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">replaced by the new note</text>
  <text x="790" y="128" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">left as it is</text>
  <text x="20" y="174" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">resolve {&quot;id&quot;: 4294967297}</text>
  <text x="540" y="174" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">resolves note 1</text>
  <text x="790" y="174" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">refused</text>
  <text x="20" y="220" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">GET /api/look from another site</text>
  <text x="540" y="220" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">the look is taken</text>
  <text x="790" y="220" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">403</text>
  <text x="20" y="266" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">a client that sends nothing</text>
  <text x="540" y="266" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">a thread held for ever</text>
  <text x="790" y="266" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">408 after 10 s</text>
  <text x="20" y="312" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">a panic in one MCP tool</text>
  <text x="540" y="312" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">atlas mcp ends</text>
  <text x="790" y="312" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">that call fails</text>
  <text x="20" y="358" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">a panic inside ty on one file</text>
  <text x="540" y="358" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">the run ends</text>
  <text x="790" y="358" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">that file untyped</text>
</svg>
