<rect x="260" y="147" width="70" height="24" rx="12" style="fill:var(--panel);fill-opacity:1;stroke:var(--key);stroke-width:1.5"/><text x="295" y="164" style="font-family:var(--mono);font-size:13px;fill:var(--key);text-anchor:middle;font-weight:600">2aa</text>
<rect x="260" y="181" width="70" height="24" rx="12" style="fill:var(--panel);fill-opacity:1;stroke:var(--key);stroke-width:1.5"/><text x="295" y="198" style="font-family:var(--mono);font-size:13px;fill:var(--key);text-anchor:middle;font-weight:600">2ab</text>
<text x="100" y="166" style="font-family:var(--sans);font-size:12.5px;fill:var(--del);text-anchor:start;font-weight:400">= arm 1 again</text>
