<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" role="img" aria-label="Step letters past z go on as aa, ab in 0.70.0 where 0.69.2 began at a again; atlas check exits 0, 1 or 2, where 0.69.2 gave 1 for a failure too">
