<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Where the mouse wheel zoomed the picture in 0.69.3 and in 0.70.0: in 0.69.3 the state bar, the zoom buttons, the legend, the hint and the status bar swallowed it, and three moments left it dead until a click; in 0.70.0 it zooms everywhere">
<text x="20" y="30" style="font-family:var(--sans);font-size:13px;fill:var(--del);text-anchor:start;font-weight:600">0.69.3</text>
<text x="500" y="30" style="font-family:var(--sans);font-size:13px;fill:var(--key);text-anchor:start;font-weight:600">0.70.0</text>
<rect x="20" y="44" width="440" height="230" rx="6" style="fill:var(--panel);fill-opacity:1;stroke:var(--line);stroke-width:1.2"/>
<rect x="20" y="44" width="440" height="26" rx="6" style="fill:var(--del);fill-opacity:0.14;stroke:var(--del);stroke-width:1.2"/>
<text x="32" y="62" style="font-family:var(--mono);font-size:11.5px;fill:var(--ink-2);text-anchor:start;font-weight:400">ROUTE  report ×</text>
<rect x="372" y="78" width="80" height="22" rx="4" style="fill:var(--del);fill-opacity:0.14;stroke:var(--del);stroke-width:1.2"/>
<text x="412" y="93" style="font-family:var(--mono);font-size:11px;fill:var(--ink-2);text-anchor:middle;font-weight:400">− fit 1:1 +</text>
<rect x="28" y="244" width="150" height="22" rx="4" style="fill:var(--del);fill-opacity:0.14;stroke:var(--del);stroke-width:1.2"/>
<text x="103" y="259" style="font-family:var(--sans);font-size:11px;fill:var(--ink-2);text-anchor:middle;font-weight:400">legend</text>
<rect x="300" y="244" width="152" height="22" rx="4" style="fill:var(--del);fill-opacity:0.14;stroke:var(--del);stroke-width:1.2"/>
<text x="376" y="259" style="font-family:var(--sans);font-size:11px;fill:var(--ink-2);text-anchor:middle;font-weight:400">hint · status bar</text>
<rect x="150" y="140" width="120" height="30" rx="15" style="fill:var(--panel);fill-opacity:1;stroke:var(--ink-3);stroke-width:1.2"/>
<text x="210" y="160" style="font-family:var(--mono);font-size:12px;fill:var(--ink);text-anchor:middle;font-weight:400">▸ Section.show</text>
<text x="240" y="215" style="font-family:var(--sans);font-size:12.5px;fill:var(--ink-2);text-anchor:middle;font-weight:400">the wheel zooms only on the bare canvas</text>
<rect x="500" y="44" width="440" height="230" rx="6" style="fill:var(--key);fill-opacity:0.10;stroke:var(--key);stroke-width:1.6"/>
<rect x="500" y="44" width="440" height="26" rx="6" style="fill:var(--panel);fill-opacity:0.6;stroke:var(--line);stroke-width:1"/>
<text x="512" y="62" style="font-family:var(--mono);font-size:11.5px;fill:var(--ink-2);text-anchor:start;font-weight:400">ROUTE  report ×</text>
<rect x="852" y="78" width="80" height="22" rx="4" style="fill:var(--panel);fill-opacity:0.6;stroke:var(--line);stroke-width:1"/>
<text x="892" y="93" style="font-family:var(--mono);font-size:11px;fill:var(--ink-2);text-anchor:middle;font-weight:400">− fit 1:1 +</text>
<rect x="508" y="244" width="150" height="22" rx="4" style="fill:var(--panel);fill-opacity:0.6;stroke:var(--line);stroke-width:1"/>
<text x="583" y="259" style="font-family:var(--sans);font-size:11px;fill:var(--ink-2);text-anchor:middle;font-weight:400">legend</text>
<rect x="780" y="244" width="152" height="22" rx="4" style="fill:var(--panel);fill-opacity:0.6;stroke:var(--line);stroke-width:1"/>
<text x="856" y="259" style="font-family:var(--sans);font-size:11px;fill:var(--ink-2);text-anchor:middle;font-weight:400">hint · status bar</text>
<rect x="630" y="140" width="120" height="30" rx="15" style="fill:var(--panel);fill-opacity:1;stroke:var(--ink-3);stroke-width:1.2"/>
<text x="690" y="160" style="font-family:var(--mono);font-size:12px;fill:var(--ink);text-anchor:middle;font-weight:400">▸ Section.show</text>
<text x="720" y="215" style="font-family:var(--sans);font-size:12.5px;fill:var(--key);text-anchor:middle;font-weight:600">the wheel zooms wherever the pointer is</text>
<line x1="20" y1="296" x2="940" y2="296" style="stroke:var(--line);stroke-width:1;fill:none"/>
<text x="20" y="322" style="font-family:var(--sans);font-size:13px;fill:var(--ink);text-anchor:start;font-weight:600">and whatever the page is doing</text>
<text x="20" y="346" style="font-family:var(--sans);font-size:12.5px;fill:var(--ink-2);text-anchor:start;font-weight:400">a drag let go outside the page (over Studio's bar): 0.69.3 panned with every move after it; 0.70.0 ends the drag</text>
<text x="20" y="366" style="font-family:var(--sans);font-size:12.5px;fill:var(--ink-2);text-anchor:start;font-weight:400">a wheel while atlas-code serve hands the page a new reading: 0.69.3 lost it; 0.70.0 keeps it</text>
<text x="20" y="386" style="font-family:var(--sans);font-size:12.5px;fill:var(--ink-2);text-anchor:start;font-weight:400">a box far larger than the window opened: 0.69.3 sank below the zoom's floor, a wheel out jumped in; 0.70.0 stops at the floor</text>
</svg>
