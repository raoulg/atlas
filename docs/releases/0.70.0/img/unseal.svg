<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 254" role="img" aria-label="A marker line after breaking its seal, and a vision placed by its path, in 0.69.2 and 0.70.0">
  <g style="font-family:var(--sans);font-size:15px;fill:var(--ink-2)">
    <text x="20" y="34">what Atlas writes into the tree</text>
    <text x="560" y="34" style="text-anchor:middle">0.69.2</text>
    <text x="800" y="34" style="text-anchor:middle;fill:var(--ink)">0.70.0</text>
  </g>
  <g style="stroke:var(--line);stroke-width:1">
    <line x1="20" y1="52" x2="940" y2="52"/>
    <line x1="20" y1="98" x2="940" y2="98"/>
    <line x1="20" y1="144" x2="940" y2="144"/>
    <line x1="20" y1="190" x2="940" y2="190"/>
    <line x1="20" y1="236" x2="940" y2="236"/>
  </g>
  <text x="20" y="82" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">#[doc = &quot;prophecy: supersedes=Sink sealed=#7&quot;]</text>
  <text x="560" y="82" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">&quot;prophecy:supersedes=Sink&quot;</text>
  <text x="800" y="82" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">&quot;prophecy: supersedes=Sink&quot;</text>
  <text x="20" y="128" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">the file emptied after reading</text>
  <text x="560" y="128" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">the call crashes</text>
  <text x="800" y="128" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">read it again</text>
  <text x="20" y="174" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">vision of sink.py, two sink.py in the tree</text>
  <text x="560" y="174" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">refused for the other</text>
  <text x="800" y="174" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">placed at its path</text>
  <text x="20" y="220" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">vision of new files only</text>
  <text x="560" y="220" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--ink-3)">placed by a guess</text>
  <text x="800" y="220" style="font-family:var(--mono);font-size:13px;text-anchor:middle;fill:var(--accent);font-weight:600">placed at its path</text>
</svg>
