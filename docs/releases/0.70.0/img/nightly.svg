<text x="562" y="115" style="font-family:var(--mono);font-size:13px;fill:var(--edit);text-anchor:middle;font-weight:700">B</text>
<text x="278" y="152" style="font-family:var(--sans);font-size:12px;fill:var(--ink-2);text-anchor:start;font-weight:400">A: the last commit within the band; B: tonight</text>
<text x="278" y="170" style="font-family:var(--sans);font-size:12px;fill:var(--ink-3);text-anchor:start;font-weight:400">what the runner does to one, it does to the other</text>
<text x="278" y="188" style="font-family:var(--sans);font-size:12px;fill:var(--ink-3);text-anchor:start;font-weight:400">every B past every A: reproduced (1 in 252 by chance)</text>
