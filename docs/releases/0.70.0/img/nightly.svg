<text x="20" y="240" style="font-family:var(--sans);font-size:14px;fill:var(--ink);text-anchor:start;font-weight:600">every Monday</text>
<rect x="20" y="252" width="120" height="30" rx="8" style="fill:var(--panel);fill-opacity:1;stroke:var(--ink-3);stroke-width:1.3"/>
