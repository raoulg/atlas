<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 265" role="img" aria-label="Ten nights of a cold reading of Atlas; night 8 is above the band of the last nights and suspect, night 9 again, and an issue opens">
<text x="20" y="30" style="font-family:var(--sans);font-size:15px;fill:var(--ink);text-anchor:start;font-weight:600">every night on next: a cold reading of Atlas, in seconds</text>
<rect x="70" y="130" width="780" height="56" rx="4" style="fill:var(--key);fill-opacity:0.1;stroke:var(--key);stroke-width:0"/>
<text x="858" y="162" style="font-family:var(--sans);font-size:12px;fill:var(--key);text-anchor:start;font-weight:400">the last nights</text>
<line x1="70" y1="200" x2="850" y2="200" style="stroke:var(--line);stroke-width:1;fill:none"/>
<polyline points="90,158 172,151 254,165 336,158 418,144 500,158 582,151 664,74 746,67 828,151" style="fill:none;stroke:var(--ink-3);stroke-width:1.4"/>
<circle cx="90" cy="158" r="5" style="fill:var(--ink-2)"/>
<text x="90" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 1</text>
<circle cx="172" cy="151" r="5" style="fill:var(--ink-2)"/>
<text x="172" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 2</text>
<circle cx="254" cy="165" r="5" style="fill:var(--ink-2)"/>
<text x="254" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 3</text>
<circle cx="336" cy="158" r="5" style="fill:var(--ink-2)"/>
<text x="336" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 4</text>
<circle cx="418" cy="144" r="5" style="fill:var(--ink-2)"/>
<text x="418" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 5</text>
<circle cx="500" cy="158" r="5" style="fill:var(--ink-2)"/>
<text x="500" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 6</text>
<circle cx="582" cy="151" r="5" style="fill:var(--ink-2)"/>
<text x="582" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 7</text>
<circle cx="664" cy="74" r="5" style="fill:var(--edit)"/>
<text x="664" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 8</text>
<circle cx="746" cy="67" r="5" style="fill:var(--del)"/>
<text x="746" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 9</text>
<circle cx="828" cy="151" r="5" style="fill:var(--ink-2)"/>
<text x="828" y="222" style="font-family:var(--sans);font-size:11.5px;fill:var(--ink-3);text-anchor:middle;font-weight:400">night 10</text>
<text x="658" y="60" style="font-family:var(--sans);font-size:12.5px;fill:var(--edit);text-anchor:end;font-weight:400">suspect</text>
<text x="756" y="53" style="font-family:var(--sans);font-size:12.5px;fill:var(--del);text-anchor:start;font-weight:600">twice: an issue opens</text>
<text x="20" y="252" style="font-family:var(--sans);font-size:12.5px;fill:var(--ink-3);text-anchor:start;font-weight:400">one slow night is noise; two in a row is a signal. No commit and no landing runs anything for it.</text>
</svg>
