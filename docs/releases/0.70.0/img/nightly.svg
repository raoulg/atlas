<text x="657" y="123" style="font-family:var(--sans);font-size:12px;fill:var(--ink-2);text-anchor:start;font-weight:400">an issue: find out where it came from</text>
<rect x="645" y="144" width="295" height="40" rx="8" style="fill:var(--panel);fill-opacity:1;stroke:var(--del);stroke-width:1.6"/>
<text x="657" y="161" style="font-family:var(--sans);font-size:13px;fill:var(--del);text-anchor:start;font-weight:600">reproduced, ×1.5 or more</text>
<text x="657" y="177" style="font-family:var(--sans);font-size:12px;fill:var(--ink-2);text-anchor:start;font-weight:400">bisected now: an urgent issue names the landing</text>
