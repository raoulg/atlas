<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 325" role="img" aria-label="A night past the band is only a reason to measure again: the same run measures the last commit within the band and tonight interleaved on one runner; not reproduced is the runner, reproduced small opens an issue, reproduced large is bisected and an urgent issue names the landing. Every Monday next is measured against the last release; by hand, any range is bisected.">
<text x="20" y="28" style="font-family:var(--sans);font-size:14px;fill:var(--ink);text-anchor:start;font-weight:600">every night</text>
