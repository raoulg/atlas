<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-label="A law comes from Atlas's mathematics. Where it can hold by construction, one function every picture uses keeps it, tested on small graphs drawn at random. Where no proof reaches, it is sampled every night on real programs, at random places within a time budget, and a broken place comes back with its seed.">
  <g style="font-family:var(--sans);font-size:15px">
    <!-- the mathematics -->
    <rect x="16" y="112" width="190" height="72" rx="4" style="fill:var(--bg);stroke:var(--ink-3)"/>
    <text x="32" y="142" style="fill:var(--ink);font-weight:500">The mathematics</text>
    <text x="32" y="164" style="fill:var(--ink-3);font-size:13px">six sentences, one home</text>

    <line x1="206" y1="148" x2="256" y2="148" style="stroke:var(--ink-3);stroke-width:1.5" marker-end="url(#d-head)"/>

    <!-- a law -->
    <rect x="262" y="112" width="200" height="72" rx="4" style="fill:var(--bg);stroke:var(--ink-3)"/>
    <text x="278" y="142" style="fill:var(--ink);font-weight:500">A law</text>
    <text x="278" y="164" style="fill:var(--ink-3);font-size:13px">opening a box moves</text>
    <text x="278" y="180" style="fill:var(--ink-3);font-size:13px">nothing else</text>

    <!-- by construction -->
    <path d="M462 136 C 500 136, 500 66, 536 66" style="fill:none;stroke:var(--key);stroke-width:1.8" marker-end="url(#d-head)"/>
    <rect x="542" y="18" width="362" height="100" rx="4" style="fill:var(--bg);stroke:var(--key);stroke-width:1.5"/>
    <text x="558" y="46" style="fill:var(--key);font-weight:600">First, from principle</text>
    <text x="558" y="70" style="fill:var(--ink-2);font-size:14px">one function every picture uses keeps it,</text>
    <text x="558" y="90" style="fill:var(--ink-2);font-size:14px">tested on small graphs drawn at random,</text>
    <text x="558" y="108" style="fill:var(--ink-3);font-size:13px">so it holds for every picture</text>

    <!-- by sampling -->
    <path d="M462 162 C 500 162, 500 232, 536 232" style="fill:none;stroke:var(--edit);stroke-width:1.8;stroke-dasharray:5 4" marker-end="url(#d-head)"/>
    <rect x="542" y="180" width="362" height="104" rx="4" style="fill:var(--bg);stroke:var(--edit);stroke-width:1.5;stroke-dasharray:5 4"/>
    <text x="558" y="208" style="fill:var(--edit);font-weight:600">Where no proof reaches, by chance</text>
    <text x="558" y="232" style="fill:var(--ink-2);font-size:14px">every night, on real programs, at places</text>
    <text x="558" y="252" style="fill:var(--ink-2);font-size:14px">drawn at random, within a time budget;</text>
    <text x="558" y="272" style="fill:var(--ink-3);font-size:13px">a broken place comes back with its seed</text>
  </g>
</svg>
