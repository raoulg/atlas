<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-label="A name bound to what operators compute of names adds no arrow: draw and list written with the expression in place and written with the names gap and both draw one picture in 0.71, in which Level first and Level QUIET reach both steps; before, Rust and TypeScript drew both as a value of its own, and first and QUIET reached neither step">
<defs>
<marker id="nm-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--key)"/></marker>
<marker id="nm-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-3)"/></marker>
</defs>
<rect x="20" y="20" width="340" height="80" rx="8" style="fill:var(--panel);stroke:var(--line);stroke-width:1.5"/>
