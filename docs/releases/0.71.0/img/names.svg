<text x="440" y="108" style="font-family:var(--sans);font-size:14px;fill:var(--key);text-anchor:middle;font-weight:600">one picture</text>
<text x="440" y="127" style="font-family:var(--sans);font-size:13px;fill:var(--ink-2);text-anchor:middle">a name adds no arrow</text>
<line x1="360" y1="262" x2="536" y2="262" style="stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:6 5" marker-end="url(#nm-g)"/>
<text x="448" y="282" style="font-family:var(--sans);font-size:13px;fill:var(--ink-3);text-anchor:middle">a value of its own</text>
