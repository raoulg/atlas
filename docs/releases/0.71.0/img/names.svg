<text x="855" y="298" style="font-family:var(--mono);font-size:14px;fill:var(--ink-3);text-anchor:middle">draw</text>
<text x="560" y="298" style="font-family:var(--sans);font-size:13px;fill:var(--del);font-weight:600">✕ first, QUIET reach neither</text>
<text x="20" y="342" style="font-family:var(--sans);font-size:12px;fill:var(--ink-3)">teal: what 0.71 draws, for both forms · gray dashed: what Rust and TypeScript drew · red: the fact that went missing</text>
</svg>
