<text x="36" y="66" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">draw(first.db - QUIET.db);</text>
<text x="36" y="86" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">list(&amp;[first, &amp;QUIET]);</text>
