<text x="36" y="214" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">let <tspan style="fill:var(--key);font-weight:600">gap</tspan> = first.db - QUIET.db;</text>
<text x="36" y="234" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">draw(<tspan style="fill:var(--key);font-weight:600">gap</tspan>);</text>
<text x="36" y="254" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">let <tspan style="fill:var(--key);font-weight:600">both</tspan> = [first, &amp;QUIET];</text>
<text x="36" y="274" style="font-family:var(--mono);font-size:13px;fill:var(--ink)">list(&amp;<tspan style="fill:var(--key);font-weight:600">both</tspan>);</text>
