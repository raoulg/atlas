<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" role="img" aria-label="The overview draws every type a function makes or takes, in the smallest package that holds its makers and takers: Shelf, made in store and taken in report, stands in shelf; Card, made by card and taken by nothing, stands in card, where 0.71 drew no box.">
<defs><marker id="bg-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-3)"/></marker></defs>
<rect x="20" y="24" width="920" height="216" rx="6" style="fill:var(--ink-3);fill-opacity:0.05;stroke:var(--ink-3);stroke-width:1.3"/><text x="32" y="46" style="font-family:var(--mono);font-size:14px;fill:var(--ink-2)">▾ shelf</text>
<rect x="50" y="70" width="230" height="140" rx="6" style="fill:var(--ink-3);fill-opacity:0.05;stroke:var(--ink-3);stroke-width:1.3"/><text x="62" y="92" style="font-family:var(--mono);font-size:14px;fill:var(--ink-2)">▾ store</text>
<rect x="480" y="62" width="440" height="160" rx="6" style="fill:var(--ink-3);fill-opacity:0.05;stroke:var(--ink-3);stroke-width:1.3"/><text x="492" y="84" style="font-family:var(--mono);font-size:14px;fill:var(--ink-2)">▾ report</text>
<rect x="520" y="100" width="380" height="104" rx="6" style="fill:var(--ink-3);fill-opacity:0.05;stroke:var(--ink-3);stroke-width:1.3"/><text x="532" y="122" style="font-family:var(--mono);font-size:14px;fill:var(--ink-2)">▾ card</text>
<rect x="110" y="140" width="110" height="36" rx="18" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6"/><text x="165.0" y="163" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">disk</text>
<rect x="330" y="140" width="100" height="36" rx="3" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.4"/><rect x="330" y="140" width="4" height="36" style="fill:var(--ink-3)"/><text x="382.0" y="163" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">Shelf</text>
<rect x="552" y="140" width="96" height="36" rx="18" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6"/><text x="600.0" y="163" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">card</text>
<rect x="728" y="140" width="110" height="36" rx="3" style="fill:var(--panel);stroke:var(--add);stroke-width:3"/><rect x="728" y="140" width="4" height="36" style="fill:var(--ink-3)"/><text x="785.0" y="163" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">Card</text>
<path d="M220,158 L328,158" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#bg-g)"/>
<path d="M430,158 L550,158" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#bg-g)"/>
<path d="M648,158 L726,158" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#bg-g)"/>
<text x="380" y="270" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">made in store, taken in report:</text>
<text x="380" y="290" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">a box in shelf, which holds both</text>
<text x="783" y="270" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">made by card, taken by nothing:</text>
<text x="783" y="290" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">a box in card · 0.71 drew none</text>
<text x="30" y="322" style="font-family:var(--sans);font-size:13px;fill:var(--ink-3);text-anchor:start">frame: a package · pill: a function · box: a type of data · green: the box only 0.72 draws</text>
</svg>
