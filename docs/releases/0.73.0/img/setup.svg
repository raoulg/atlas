<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Two shelves of one class: drafts = Shelf(&quot;drafts&quot;) and out = Shelf(&quot;out&quot;). drafts.read() reads drafts/report.txt only; 0.72 also drew it reading out/report.txt, the file of the other shelf.">
