<rect x="110.8" y="282" width="4" height="36" style="fill:var(--ink-3)"/>
<text x="150" y="305" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">Cached</text>
<path d="M196,296 C260,290 300,262 336,250" style="fill:none;stroke:var(--del);stroke-width:2;stroke-dasharray:6 5" marker-end="url(#m-del)"/>
<text x="220" y="336" style="font-family:var(--sans);font-size:14px;fill:var(--del);text-anchor:middle">0.72: taken from outside</text>
<text x="30" y="346" style="font-family:var(--sans);font-size:13px;fill:var(--ink-3)">pill: a call · box: a value · green: the step at the cut, drawn as its body closed · red: drawn by 0.72 only</text>
</svg>
