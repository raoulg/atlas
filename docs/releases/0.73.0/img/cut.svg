<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="headlines opened builds a Feed and calls feed.lines(), which reads through Cached.read on the feed itself. Closed, it takes nothing from outside. Drawn at the cut, 0.73 gives the same box; 0.72 drew it taking a Cached from outside.">
<defs><marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-3)"/></marker><marker id="m-add" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--add)"/></marker><marker id="m-del" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--del)"/></marker></defs>
<text x="30" y="36" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:start">opened</text>
<rect x="30" y="50" width="700" height="90" rx="6" style="fill:var(--ink-3);fill-opacity:0.05;stroke:var(--ink-3);stroke-width:1.3"/>
<text x="42" y="72" style="font-family:var(--mono);font-size:14px;fill:var(--ink-2)">▾ headlines</text>
<rect x="70.8" y="90" width="78.4" height="36" rx="18" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6"/>
<text x="110" y="113" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">Feed()</text>
<rect x="219.2" y="90" width="61.6" height="36" rx="3" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.4"/>
<rect x="219.2" y="90" width="4" height="36" style="fill:var(--ink-3)"/>
<text x="250" y="113" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">Feed</text>
<rect x="335.6" y="90" width="128.8" height="36" rx="18" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6"/>
<text x="400" y="113" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">feed.lines()</text>
<rect x="529.8" y="90" width="120.4" height="36" rx="18" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6"/>
<text x="590" y="113" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">Cached.read</text>
<path d="M150,108 L205,108" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<path d="M295,108 L338,108" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<path d="M462,108 L527,108" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<rect x="799.8" y="90" width="120.4" height="36" rx="3" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.4"/>
<rect x="799.8" y="90" width="4" height="36" style="fill:var(--ink-3)"/>
<text x="860" y="113" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">list[bytes]</text>
<path d="M652,108 L808,108" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<text x="30" y="196" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:start">at the cut</text>
<rect x="339.8" y="222" width="120.4" height="36" rx="18" style="fill:var(--panel);stroke:var(--add);stroke-width:3"/>
<text x="400" y="245" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">▸ headlines</text>
<rect x="799.8" y="222" width="120.4" height="36" rx="3" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.4"/>
<rect x="799.8" y="222" width="4" height="36" style="fill:var(--ink-3)"/>
<text x="860" y="245" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">list[bytes]</text>
<path d="M462,240 L808,240" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<text x="590" y="228" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">the same lines as opened, then closed</text>
