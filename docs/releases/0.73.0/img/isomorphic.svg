<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="Three ways of writing a test, in Python, Rust and TypeScript, are each read as one construct, a test, which is drawn as one picture: a route of its own, named by the test.">
<defs><marker id="m-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink-3)"/></marker><marker id="m-add" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--add)"/></marker><marker id="m-del" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--del)"/></marker></defs>
<text x="40" y="64" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:start">Python</text>
<rect x="84.6" y="70" width="170.8" height="36" rx="3" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.4"/>
<text x="170" y="93" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">def test_short():</text>
<path d="M259,88 C380,88 380,170 438,170" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<text x="40" y="144" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:start">Rust</text>
<rect x="80.4" y="150" width="179.2" height="36" rx="3" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.4"/>
<text x="170" y="173" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">#[test] fn short()</text>
<path d="M264,168 C380,168 380,170 438,170" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<text x="40" y="224" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:start">TypeScript</text>
<rect x="72.0" y="230" width="196.0" height="36" rx="3" style="fill:var(--panel);stroke:var(--ink-3);stroke-width:1.4"/>
<text x="170" y="253" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">it(&quot;short&quot;, () =&gt; …)</text>
<path d="M272,248 C380,248 380,170 438,170" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<text x="400" y="120" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">read as</text>
<rect x="440" y="140" width="170" height="60" rx="6" style="fill:var(--ink-3);fill-opacity:0.05;stroke:var(--ink-3);stroke-width:1.3"/>
<text x="452" y="162" style="font-family:var(--mono);font-size:14px;fill:var(--ink-2)"></text>
<text x="525" y="176" style="font-family:var(--mono);font-size:15px;fill:var(--ink);text-anchor:middle">a test</text>
<path d="M612,170 L688,170" style="fill:none;stroke:var(--ink-3);stroke-width:2" marker-end="url(#m-g)"/>
<text x="650" y="158" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">drawn as</text>
<rect x="745.6" y="152" width="128.8" height="36" rx="18" style="fill:var(--panel);stroke:var(--add);stroke-width:3"/>
<text x="810" y="175" style="font-family:var(--mono);font-size:14px;fill:var(--ink);text-anchor:middle">test · short</text>
<text x="810" y="215" style="font-family:var(--sans);font-size:14px;fill:var(--ink-2);text-anchor:middle">a route of its own</text>
<text x="30" y="286" style="font-family:var(--sans);font-size:13px;fill:var(--ink-3)">left: what the author writes · middle: what Atlas reads · right: what it draws · green: the one picture</text>
</svg>
