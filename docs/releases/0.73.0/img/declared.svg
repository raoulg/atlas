<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-label="Exporter.export is only declared: it takes and gives nothing of its own. publish calls it, which runs one of its two members, CsvExporter.export writing out.csv or JsonExporter.export writing out.json. 0.72 drew Exporter.export taking a Report and giving a Receipt.">
