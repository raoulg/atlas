<meta charset="utf-8">
<title>Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --ink:#1B2029; --ink-2:#4B5563; --ink-3:#8A94A3;
  --line:#D5DAE1; --line-2:#E6E9EE; --alert:#D9481C; --focus:#1B2029;
  --role-Source:#1F8A7E; --role-Graph:#3F5FCF; --role-Sink:#C7862B; --role-Repository:#7E56B8;
  --role-Analysis:#C44F70; --role-API:#4E9A4E; --role-CLI:#5C6B80; --role-Schema:#7D7A72;
  --role-Config:#9A968C; --role-Other:#9A968C; --role-External:#A0A6AE;
  --syn-kw:#7E3FA8; --syn-str:#1F7A5C; --syn-com:#8A94A3; --syn-num:#B4551C; --syn-fn:#2B4FBF; --syn-dec:#A0641E; --syn-bi:#1F6E8C;
  --hue-1:#1F8A7E; --hue-2:#3F5FCF; --hue-3:#C7862B; --hue-4:#7E56B8; --hue-5:#C44F70; --hue-6:#4E9A4E; --hue-7:#5C6B80; --hue-8:#7D7A72;
  --k-cmd:#2F7D4F; --k-file:#B26A00; --k-db:#7E56B8; --k-web:#1F7A8C; --k-screen:#3F5FCF; --k-proc:#5C6B80; --k-model:#C44F70;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14181D; --panel:#1C2128; --panel-2:#222932; --ink:#E6EAF0; --ink-2:#AEB6C2; --ink-3:#6F7987;
  --line:#2C343E; --line-2:#242B34; --alert:#F0663D; --focus:#E6EAF0;
  --role-Source:#3DB8A9; --role-Graph:#7B93E8; --role-Sink:#E0A24A; --role-Repository:#A98AD9;
  --role-Analysis:#E27A96; --role-API:#77BF77; --role-CLI:#8C9BB0; --role-Schema:#A39F95;
  --role-Config:#B0ABA0; --role-Other:#B0ABA0; --role-External:#7F8792;
  --syn-kw:#C792EA; --syn-str:#7FCFA8; --syn-com:#6F7987; --syn-num:#F0A070; --syn-fn:#8FB0FF; --syn-dec:#E0B070; --syn-bi:#7FC4E0;
  --hue-1:#3DB8A9; --hue-2:#7B93E8; --hue-3:#E0A24A; --hue-4:#A98AD9; --hue-5:#E27A96; --hue-6:#77BF77; --hue-7:#8C9BB0; --hue-8:#A39F95;
  --k-cmd:#6CC08C; --k-file:#E0A24A; --k-db:#B596E6; --k-web:#5CC0D4; --k-screen:#8FA6F0; --k-proc:#9AA8BC; --k-model:#E88AA4;
}}
:root[data-theme="dark"]{
  --k-cmd:#6CC08C; --k-file:#E0A24A; --k-db:#B596E6; --k-web:#5CC0D4; --k-screen:#8FA6F0; --k-proc:#9AA8BC; --k-model:#E88AA4;
  --bg:#14181D; --panel:#1C2128; --panel-2:#222932; --ink:#E6EAF0; --ink-2:#AEB6C2; --ink-3:#6F7987;
  --line:#2C343E; --line-2:#242B34; --alert:#F0663D; --focus:#E6EAF0;
  --role-Source:#3DB8A9; --role-Graph:#7B93E8; --role-Sink:#E0A24A; --role-Repository:#A98AD9;
  --role-Analysis:#E27A96; --role-API:#77BF77; --role-CLI:#8C9BB0; --role-Schema:#A39F95;
  --role-Config:#B0ABA0; --role-Other:#B0ABA0; --role-External:#7F8792;
  --syn-kw:#C792EA; --syn-str:#7FCFA8; --syn-com:#6F7987; --syn-num:#F0A070; --syn-fn:#8FB0FF; --syn-dec:#E0B070; --syn-bi:#7FC4E0;
  --hue-1:#3DB8A9; --hue-2:#7B93E8; --hue-3:#E0A24A; --hue-4:#A98AD9; --hue-5:#E27A96; --hue-6:#77BF77; --hue-7:#8C9BB0; --hue-8:#A39F95;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden}
#app{display:grid;grid-template-rows:46px 1fr;grid-template-columns:1fr var(--aside-w,820px);height:100vh}
#resizer{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;z-index:3}
#app.noaside{grid-template-columns:1fr 0}
#app.noaside aside,#app.noaside #resizer{display:none}
#resizer:hover{background:color-mix(in oklab, var(--ink-3) 30%, transparent)}
#entry,#project{font:inherit;font-family:var(--mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--ink);max-width:340px}
#project{font-weight:600;padding:3px 6px}
.recipe{font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;white-space:pre;overflow-x:auto;margin:6px 0 0}
.story-title{font-family:var(--sans);font-size:15px;font-weight:600;fill:var(--ink)}
.story-sub{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.lane-label{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink-3)}
.lane-line{stroke:var(--line-2)}
.srow{cursor:pointer}
.srow-bg{fill:transparent}
.srow:hover .srow-bg{fill:var(--panel)}
.srow.selected .srow-bg{fill:var(--panel);stroke:var(--focus)}
.srow .num{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
.srow .chev{font-size:12px;fill:var(--ink-2);cursor:pointer}
.srow .sname{font-family:var(--mono);font-size:12.5px;font-weight:600;fill:var(--ink)}
.srow .stype{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.srow .smod{font-family:var(--sans);font-size:10.5px;fill:var(--ink-3)}
.srow .kind{font-family:var(--sans);font-size:10px;letter-spacing:.06em;fill:var(--ink-3)}
.srow .seff{font-family:var(--sans);font-size:10.5px;fill:var(--ink-2)}
.srow .sname.ref{fill:var(--ink-3);font-weight:500}
.story-own{font-family:var(--mono);font-size:12px;fill:var(--ink-2)}
.lanes-bg{fill:var(--bg);opacity:.94}
.tnode .fam{font-family:var(--sans);font-size:9.5px;fill:var(--ink-3);letter-spacing:.04em}
.tnode .endo{font-family:var(--mono);font-size:10px;fill:var(--ink-2)}
.dot{fill:var(--ink-2);opacity:.85}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .brand{font-weight:600;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
header .brand small{font-weight:400;color:var(--ink-3);font-family:var(--mono);font-size:11px}
.tabs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:2px}
.tabs button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-weight:500;padding:4px 12px;border-radius:4px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs button:focus-visible,.toggles label:focus-within,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.toggles{display:flex;gap:12px;align-items:center;color:var(--ink-2)}
.toggles label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.toggles input{accent-color:var(--ink)}
.toggles .alert{color:var(--alert)}
.spacer{flex:1}
.stats{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
#search{font:inherit;font-family:var(--mono);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--ink);width:240px}
#search:focus{outline:2px solid var(--focus);outline-offset:1px}
main{position:relative;overflow:hidden}
svg#canvas{width:100%;height:100%;display:block;cursor:grab}
svg#canvas:active{cursor:grabbing}
#legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--ink-2);max-width:280px}
#legend .row{display:flex;flex-wrap:wrap;gap:4px 10px}
#legend .legend-head{all:unset;cursor:pointer;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
#legend .legend-head:hover{color:var(--ink)}
#legend .sw{display:inline-flex;align-items:center;gap:5px}
#legend .sw i{width:10px;height:10px;border-radius:2px;display:inline-block}
#legend .k{display:inline-flex;align-items:center;gap:6px}
#legend svg{overflow:visible}
#hint{position:absolute;right:14px;bottom:14px;font-size:11px;color:var(--ink-3)}
#zoomctl{position:absolute;right:14px;top:14px;display:flex;gap:4px}
#crumbs{position:absolute;left:14px;top:14px;right:200px;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;font-size:11px;color:var(--ink-3)}
#crumbs .lbl{letter-spacing:.06em;text-transform:uppercase;font-size:10px;margin-left:8px}
#crumbs .lbl:first-child{margin-left:0}
#crumbs .none{font-family:var(--mono);color:var(--ink-2)}
#crumbs button{font:inherit;font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:1px 9px;cursor:pointer}
#crumbs button:hover{border-color:var(--ink-3)}
.sedge.reach{stroke-dasharray:5 4}
.sedge.back{stroke-dasharray:1 3;stroke-linecap:round}
.tstep{cursor:pointer}
.tstep.own rect.bg{fill:var(--panel);stroke-dasharray:none}
.tnode.world rect.bg{fill:color-mix(in oklab, var(--k) 12%, var(--panel));stroke:color-mix(in oklab, var(--k) 55%, var(--line))}
.tnode.ref rect.bg{fill:transparent;stroke-dasharray:3 3}
.tnode.ref .title{fill:var(--ink-3);font-weight:500}
.glyph{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
svg.glyph{vertical-align:-2px}
.frame rect.bg{fill:color-mix(in oklab, var(--panel) 55%, transparent);stroke:var(--line);stroke-width:1.2}
.frame.choice rect.bg{stroke-dasharray:6 4;stroke:var(--ink-3)}
.frame.fam rect.bg{fill:color-mix(in oklab, var(--panel-2) 70%, transparent)}
.frame .ftitle{font-family:var(--mono);font-size:11.5px;font-weight:600;fill:var(--ink-2);cursor:pointer}
.frame .ftitle:hover{fill:var(--ink)}
.sedge-head{fill:var(--ink-3)}
.tstep rect.bg{fill:var(--panel-2);stroke:var(--ink-3)}
.tstep .title{font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--ink)}
.tstep:hover rect.bg,.tstep.selected rect.bg{stroke:var(--focus);stroke-width:1.6}
.tnode.entry .title{font-family:var(--mono);font-weight:500}
#zoomctl button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font:inherit;font-size:12px;border-radius:6px;padding:3px 9px;cursor:pointer;min-width:30px}
#zoomctl button:hover{color:var(--ink);border-color:var(--ink-3)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 20px 40px}
aside .empty{color:var(--ink-3);padding-top:40px;text-align:center;line-height:1.6}
aside .empty b{color:var(--ink-2);display:block;margin-bottom:6px;font-weight:500}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow .role{padding:1px 7px;border-radius:3px;color:#fff;letter-spacing:.04em;font-weight:500}
h1.name{font-family:var(--mono);font-size:17px;font-weight:600;margin:6px 0 2px;word-break:break-all;text-wrap:balance}
.path{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:12px;word-break:break-all}
.sig{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.doc{color:var(--ink-2);margin-bottom:14px;max-width:62ch}
.sec{margin:14px 0 0}
.sec h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:500;display:flex;gap:8px;align-items:baseline}
.sec h3 span{color:var(--ink-3);font-family:var(--mono);letter-spacing:0;text-transform:none}
.links{display:flex;flex-wrap:wrap;gap:4px}
.links button{font:inherit;font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:4px;padding:2px 7px;cursor:pointer;text-align:left}
.links button.cls{border-radius:3px}
.links button.fn{border-radius:10px}
.links button:hover{border-color:var(--ink-3)}
.links button i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:0}
pre.code{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:10px 0;overflow-x:auto;margin:6px 0 0;counter-reset:ln var(--ln0)}
pre.code .l{display:block;padding:0 12px 0 0;white-space:pre}
pre.code .l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:46px;padding-right:12px;text-align:right;color:var(--ink-3);user-select:none}
.hljs-keyword{color:var(--syn-kw)} .hljs-string{color:var(--syn-str)} .hljs-comment{color:var(--syn-com);font-style:italic}
.hljs-number{color:var(--syn-num)} .hljs-title,.hljs-title.function_{color:var(--syn-fn)} .hljs-meta{color:var(--syn-dec)} .hljs-built_in{color:var(--syn-bi)}
.hljs-params{color:var(--ink)}
/* canvas */
.card{cursor:pointer}
.card rect.bg{fill:var(--panel);stroke:var(--line)}
.card .title{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
.card .sub{font-family:var(--sans);font-size:10px;fill:var(--ink-3)}
.card .strip{opacity:.9}
.chip{cursor:pointer}
.chip rect{stroke-width:1}
.chip text{font-family:var(--mono);font-size:10.5px;fill:var(--ink)}
.chip.more rect{fill:transparent;stroke:var(--line)}
.chip.more text{fill:var(--ink-3)}
.chip:hover rect{stroke-width:1.6}
.edge{fill:none;opacity:.32;cursor:pointer}
.edge.back{stroke:var(--alert)!important;opacity:.7}
.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.arrow{opacity:.5}
.scene.focus .edge.on{opacity:.9}.scene.focus .arrow.on{opacity:1}
.arrow.back{fill:var(--alert)!important;opacity:.95}
.scene.focus .edge:not(.on){opacity:.06}.scene.focus .arrow:not(.on){opacity:.06}
.scene.focus .card:not(.on):not(.hover){opacity:.3}
.scene.focus .tnode:not(.on){opacity:.3}
.card.selected rect.bg,.tnode.selected rect.bg{stroke:var(--focus);stroke-width:2}
.chip.selected rect{stroke:var(--focus);stroke-width:2}
.band-label,.col-label{font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;fill:var(--ink-3)}
.col-label.role{font-weight:600;font-size:13px;letter-spacing:.06em}
.col-line{stroke:var(--line);stroke-dasharray:2 4}
.tnode{cursor:pointer}
.tnode rect.bg{fill:var(--panel);stroke:var(--line)}
.tnode.ghost rect.bg{stroke-dasharray:4 3;fill:transparent}
.tnode .title{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
.tnode .sub{font-family:var(--sans);font-size:10px;fill:var(--ink-3)}
.tnode .badge{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}
.tlink{fill:none;stroke:var(--line);stroke-width:1.2}
.tlink.on{stroke:var(--ink-2)}
.sedge{fill:none;stroke:var(--ink-3);opacity:.8;cursor:pointer}
.sedge.has{stroke-dasharray:2 3}
.sedge-label{font-family:var(--mono);font-size:10px;fill:var(--ink-2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.group-label{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){ .card,.edge,.arrow,.tnode{transition:opacity .18s ease} }
@media (max-width:900px){ #app{grid-template-columns:1fr 0} aside{display:none} }
</style>

<div id="app">
  <header>
    <div class="brand">Atlas <select id="project" aria-label="project"></select> <small>spike</small></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="story" aria-selected="true">Story</button>
      <button role="tab" data-view="plaat" aria-selected="false">Plaat</button>
      <button role="tab" data-view="arch" aria-selected="false">Architecture</button>
      <button role="tab" data-view="types" aria-selected="false">Type lattice</button>
      <button role="tab" data-view="sig" aria-selected="false">Signature flow</button>
    </div>
    <select id="entry" aria-label="entry point"><option value="">All entry points</option></select>
    <div class="toggles" id="toggles">
      <label><input type="checkbox" data-kind="calls" checked> calls</label>
      <label><input type="checkbox" data-kind="types" checked> types</label>
      <label><input type="checkbox" data-kind="imports"> imports</label>
      <label><input type="checkbox" data-kind="inherits"> inherits</label>
      <label class="alert"><input type="checkbox" id="backflow" checked> mark backflow</label>
    </div>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
    <input id="search" list="symbols" placeholder="jump to symbol…" autocomplete="off">
    <datalist id="symbols"></datalist>
  </header>
  <main>
    <svg id="canvas"><g id="scene" class="scene"></g><g id="lanes"></g></svg>
    <div id="crumbs" aria-label="what this picture shows"></div>
    <div id="zoomctl"><button id="zout" type="button" title="zoom out">−</button><button id="fit" type="button">fit</button><button id="zone" type="button" title="actual size">1:1</button><button id="zin" type="button" title="zoom in">+</button><button id="codetoggle" type="button" title="show or hide the code panel">hide code</button></div>
    <div id="resizer" title="drag to resize the inspector"></div>
    <div id="legend"></div>
    <div id="hint">drag to pan · scroll to zoom · click a block</div>
  </main>
  <aside id="inspector"><div class="empty"><b>Nothing selected</b>Click a module, a class or a function.<br>Hover a block to see what it talks to.</div></aside>
</div>

<script>
(function(){
const ALL = window.DATA.projects, names = Object.keys(ALL);
const wanted = (location.hash.match(/p=([\w.-]+)/) || [])[1];
const current = names.includes(wanted) ? wanted : names[0];
const D = ALL[current];
{ const ps = document.getElementById("project"); for (const n of names) { const o = document.createElement("option"); o.value = n; o.textContent = n; o.selected = n === current; ps.appendChild(o); }
  ps.addEventListener("change", () => { location.hash = "#p=" + ps.value; location.reload(); }); }
const byId = new Map(D.nodes.map(n => [n.id, n]));
for (const t of (D.make || [])) byId.set(t.id, {id: t.id, kind: "make", name: t.label, module: "Makefile", doc: t.doc, recipe: t.recipe, entry: {kind: "make", label: t.label}, make: t});
const ROOT = D.root + ".";
const short = id => id.startsWith(ROOT) ? id.slice(ROOT.length) : id.replace(/^ext:/, "");
const roleVar = r => `var(--role-${r})`;
const isPrivate = n => n.name.startsWith("_");
const KG = {imports:"imports", calls:"calls", instantiates:"calls", takes:"types", returns:"types", has:"types", mutates:"types", inherits:"inherits"};
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs={}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const html = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const chipW = name => 14 + name.length * 6.4;

// ---------- indexes ----------
const modules = D.nodes.filter(n => n.kind === "module");
const symsOf = new Map();  // module id -> [class/function nodes]
for (const n of D.nodes) if (n.kind === "class" || n.kind === "function") { if (!symsOf.has(n.module)) symsOf.set(n.module, []); symsOf.get(n.module).push(n); }
const out = new Map(), inn = new Map();
