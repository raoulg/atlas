name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          notes=""
          # a stable release has a page of release notes with pictures (tools/release_page.py)
          if [ -z "$pre" ] && [ -f "docs/releases/${GITHUB_REF_NAME#v}.md" ]; then
            notes="**What changed, with pictures:** https://atlas.pttrn.io/releases/${GITHUB_REF_NAME#v}/"
          fi
          # a draft until every file is uploaded: `publish` makes it public, so `releases/latest`
          # (Studio's and `atlas-code update`'s question) never names a release whose files are not there yet
          gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes" $pre
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p atlas-code
      - name: package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/atlas-code-${{ matrix.target }}.zip" atlas-code.exe
          else
            tar -czf "$GITHUB_WORKSPACE/atlas-code-${{ matrix.target }}.tar.gz" atlas-code
          fi
      - run: gh release upload "$GITHUB_REF_NAME" atlas-code-${{ matrix.target }}.*
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  # Atlas Studio for macOS and Windows, its disk images and setup program beside the CLI's archives.
  studio:
    needs: create
    uses: ./.github/workflows/studio.yml
    with:
      ref: ${{ github.sha }}
      channel: release

  studio-upload:
    needs: studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: atlas-studio-*
          path: dist
          merge-multiple: true
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [build, studio-upload]
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "$GITHUB_REF_NAME" in *-*) latest=--latest=false ;; *) latest=--latest ;; esac
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false $latest
        env:
          GH_TOKEN: ${{ github.token }}

  install:
    needs: publish
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        run: sh install.sh && "$HOME/.local/bin/atlas-code" --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1; & "$env:LOCALAPPDATA\Programs\atlas-code\atlas-code.exe" --version

  # The Homebrew tap (raoulg/homebrew-tap) takes the new version and the checksums of the release:
  # the formula `atlas-code` from the CLI's archives (`tools/tap_formula.py`), the cask `atlas-studio`
  # from Studio's disk images (`tools/tap_cask.py`). It needs the secret TAP_TOKEN (a token with Contents: write on that
  # repository only); without it the job says so and does nothing.
  tap:
    needs: [publish, install]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: atlas
      - env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::no TAP_TOKEN: the tap is not updated"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --pattern 'atlas-studio-*.dmg' --dir assets
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/raoulg/homebrew-tap.git" tap
          python3 atlas/tools/tap_formula.py assets "$version" > tap/Formula/atlas-code.rb
          mkdir -p tap/Casks
          python3 atlas/tools/tap_cask.py assets "$version" > tap/Casks/atlas-studio.rb
          cd tap
          git config user.name "atlas release"
          git config user.email "atlas@users.noreply.github.com"
          git add Formula/atlas-code.rb Casks/atlas-studio.rb
          git diff --cached --quiet && { echo "the tap already names ${version}"; exit 0; }
          git commit -m "Atlas ${version}"
          git pull --rebase
          git push
