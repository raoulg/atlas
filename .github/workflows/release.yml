name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $pre
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p atlas
      - name: package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/atlas-${{ matrix.target }}.zip" atlas.exe
          else
            tar -czf "$GITHUB_WORKSPACE/atlas-${{ matrix.target }}.tar.gz" atlas
          fi
      - run: gh release upload "$GITHUB_REF_NAME" atlas-${{ matrix.target }}.*
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

  # Atlas Studio for macOS and Windows, its disk images and setup program beside the CLI's archives.
  studio:
    needs: create
    uses: ./.github/workflows/studio.yml
    with:
      ref: ${{ github.sha }}

  studio-upload:
    needs: studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: atlas-studio-*
          path: dist
          merge-multiple: true
      - run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  install:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os != 'Windows'
        run: sh install.sh && "$HOME/.local/bin/atlas" --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1; & "$env:LOCALAPPDATA\Programs\atlas\atlas.exe" --version

  # The Homebrew tap (raoulg/homebrew-tap) takes the new version and the checksums of the release.
  # It needs the secret TAP_TOKEN (a token with Contents: write on that repository only); without
  # it the job says so and does nothing.
  tap:
    needs: [build, install]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::warning::no TAP_TOKEN: the tap is not updated"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz' --dir assets
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/raoulg/homebrew-tap.git" tap
          python3 - "$version" "$GITHUB_REF_NAME" <<'PY'
          import hashlib, pathlib, re, sys
          version, tag = sys.argv[1:]
          path = pathlib.Path("tap/Formula/atlas-code.rb")
          text = re.sub(r'version "[^"]*"', f'version "{version}"', path.read_text(), count=1)
          for target in ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]:
              sha = hashlib.sha256(pathlib.Path(f"assets/atlas-{target}.tar.gz").read_bytes()).hexdigest()
              text = re.sub(
                  rf'url "[^"]*/atlas-{target}\.tar\.gz"\n(\s*)sha256 "[^"]*"',
                  lambda m: f'url "https://github.com/raoulg/atlas/releases/download/{tag}/atlas-{target}.tar.gz"\n{m.group(1)}sha256 "{sha}"',
                  text,
              )
          path.write_text(text)
          PY
          cd tap
          git config user.name "atlas release"
          git config user.email "atlas@users.noreply.github.com"
          git diff --quiet && { echo "the tap already names ${version}"; exit 0; }
          git commit -am "Atlas ${version}"
          git pull --rebase
          git push
