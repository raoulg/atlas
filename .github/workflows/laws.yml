name: laws

# Every night, the laws of views and of a route's pictures asked of real programs at sites drawn from
# a fresh seed, within a time budget (`engine/tests/sample.rs`). Passing is evidence, never a proof; a
# site that breaks fails the run, and the run's summary names the seed and the `ATLAS_SAMPLE_N` that
# bring the site back on the same revisions. A broken site is a question, about the law, the code or
# the sampler, and gets an issue before anything is changed. The programs are Atlas itself, as `next`
# has it, and the public programs of the corpus that `laws` reads (`tools/corpus.txt`), in each language
# Atlas reads, each at a fixed revision so that a site can be asked again. A private program of the
# corpus is never sampled: the report names the sites it asks.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "The time budget, in seconds"
        default: "1200"
      seed:
        description: "A seed to ask again (empty: drawn)"
        default: ""

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
          path: atlas
      # the sampled route pictures run the viewer's model in node, as engine/tests/plans.rs does
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.0
      # the corpus's dependencies come from the tools' downloads, kept between runs for one list of programs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.npm
          key: corpus-downloads-${{ runner.os }}-${{ hashFiles('atlas/tools/corpus.txt') }}
      - name: the corpus, at its revisions
        run: uv run atlas/tools/perf.py corpus fetch --into programs --for laws
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
      - name: sample the laws
        working-directory: atlas
        env:
          ATLAS_SAMPLE_SECONDS: ${{ inputs.seconds || '1200' }}
          ATLAS_SAMPLE_SEED: ${{ inputs.seed }}
          ATLAS_SAMPLE_OUT: ${{ github.workspace }}/sample.json
        run: |
          set -o pipefail
          ATLAS_SAMPLE_REPOS="$GITHUB_WORKSPACE/atlas:$(uv run tools/perf.py corpus paths --into ../programs --for laws)"
          export ATLAS_SAMPLE_REPOS
          cargo test --release --locked -p atlas-engine --test sample -- --ignored --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/sample.log"
      - name: what was asked
        if: always()
        run: |
          {
            echo '### The laws, sampled'
            echo '```'
            grep -E 'ATLAS_SAMPLE_SEED|nodes,|sites in|asked,|broke a law|^site ' sample.log || echo "the sampler did not run to its report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sample
          path: |
            sample.json
            sample.log
