name: laws

# Every night, the laws of views and of a route's pictures asked of real programs at sites drawn from
# a fresh seed, within a time budget (`engine/tests/sample.rs`). Passing is evidence, never a proof; a
# site that breaks fails the run, and the run's summary names the seed and the `ATLAS_SAMPLE_N` that
# bring the site back on the same revisions. A broken site is a question, about the law, the code or
# the sampler, and gets an issue before anything is changed. The programs are Atlas itself, as `next`
# has it, and public programs in each language Atlas reads, each at a fixed revision so that a site
# can be asked again; a new revision is a change to this file.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "The time budget, in seconds"
        default: "1200"
      seed:
        description: "A seed to ask again (empty: drawn)"
        default: ""

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
          path: atlas
      - name: the programs, at fixed revisions
        run: |
          get() { git init -q "programs/$1" && git -C "programs/$1" fetch -q --depth 1 "https://github.com/raoulg/$1" "$2" && git -C "programs/$1" checkout -q FETCH_HEAD; }
          get goad_toolkit 929d37cc588b27f599b7fbe2e4f5d9733619f897
          get vectormesh 201a85048dc872bfc3115d09542529302b45a3ec
          get pluim a5b8c804da33c93b1e36344072adccc3479b5b24
          get ordash 1b4942228b1b22a91c065e1093a14a106fab9f2b
      # the sampled route pictures run the viewer's model in node, as engine/tests/plans.rs does
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas
      - name: sample the laws
        working-directory: atlas
        env:
          ATLAS_SAMPLE_REPOS: ${{ github.workspace }}/atlas:${{ github.workspace }}/programs/goad_toolkit:${{ github.workspace }}/programs/vectormesh:${{ github.workspace }}/programs/pluim:${{ github.workspace }}/programs/ordash
          ATLAS_SAMPLE_SECONDS: ${{ inputs.seconds || '1200' }}
          ATLAS_SAMPLE_SEED: ${{ inputs.seed }}
          ATLAS_SAMPLE_OUT: ${{ github.workspace }}/sample.json
        run: |
          set -o pipefail
          cargo test --release --locked -p atlas-engine --test sample -- --ignored --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/sample.log"
      - name: what was asked
        if: always()
        run: |
          {
            echo '### The laws, sampled'
            echo '```'
            grep -E 'ATLAS_SAMPLE_SEED|nodes,|sites in|asked,|broke a law|^site ' sample.log || echo "the sampler did not run to its report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sample
          path: |
            sample.json
            sample.log
