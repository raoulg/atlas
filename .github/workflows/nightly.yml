name: nightly

# The nightly build of `next`, made when `next` has moved and `ci` is green for its commit: the CLI
# for five platforms and Atlas Studio for macOS and Windows (`studio.yml`). Every
# build is its own immutable pre-release, `nightly-<yyyymmddHHMM>`, which the tap's formula names
# with its checksums; the newest seven are kept. The pre-release `nightly` is the moving pointer
# `install.sh` reads: its assets are replaced in place and its tag moved to the build. A
# pre-release is never `releases/latest`, so the stable install is not touched. `release.yml`
# makes the stable release from a `v*` tag on `main`.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even when next has not moved or ci is not green"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      sha: ${{ steps.pick.outputs.sha }}
      stamp: ${{ steps.pick.outputs.stamp }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: next
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$(git rev-parse HEAD)
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" -q .object.sha 2>/dev/null || echo none)
          ci=$(gh run list --workflow ci.yml --branch next --commit "$sha" --json conclusion -q '.[0].conclusion' 2>/dev/null || echo none)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$last" = "$sha" ]; then
            echo "next has not moved since the last nightly ($sha)"
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ "$ci" != success ]; then
            echo "ci is not green for $sha ($ci): no nightly"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      ATLAS_CHANNEL: nightly
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p atlas
      - name: package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/atlas-${{ matrix.target }}.zip" atlas.exe
          else
            tar -czf "$GITHUB_WORKSPACE/atlas-${{ matrix.target }}.tar.gz" atlas
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: atlas-${{ matrix.target }}
          path: atlas-${{ matrix.target }}.*

  # Atlas Studio for macOS and Windows of the same commit: its installers go into the nightly with the CLI's
  # archives, so the release's Studio build runs every night before a tag needs it.
  studio:
    needs: decide
    if: needs.decide.outputs.build == 'true'
    uses: ./.github/workflows/studio.yml
    with:
      ref: ${{ needs.decide.outputs.sha }}
      channel: nightly

  publish:
    needs: [decide, build, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.decide.outputs.sha }}
          STAMP: ${{ needs.decide.outputs.stamp }}
        run: |
          notes="The nightly build of next at ${SHA:0:7}, ${STAMP}. Not a release: install it with ATLAS_CHANNEL=nightly, or with brew install raoulg/tap/atlas-code-nightly."
          gh release create "nightly-$STAMP" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "nightly $STAMP" --notes "$notes"
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # the files first, then the tag: Studio asks the tag which commit is newest, and installs these files
            gh release upload nightly dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$SHA" -F force=true >/dev/null
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
              --title "nightly" --notes "$notes"
          fi

  # `brew install raoulg/tap/atlas-code-nightly` and `brew install --cask raoulg/tap/atlas-studio-nightly`:
  # the tap's formula and cask of the nightly, naming the immutable pre-release just published
  # (`TAP_TOKEN` is a token that may write to the tap).
  tap:
    needs: [decide, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}
          path: atlas
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          repository: raoulg/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - env:
          SHA: ${{ needs.decide.outputs.sha }}
          STAMP: ${{ needs.decide.outputs.stamp }}
        run: |
          base=$(grep -m1 '^version' atlas/Cargo.toml | cut -d'"' -f2)
          python3 atlas/tools/tap_formula.py dist "$base" "$STAMP" > tap/Formula/atlas-code-nightly.rb
          mkdir -p tap/Casks
          python3 atlas/tools/tap_cask.py dist "$base" "$STAMP" > tap/Casks/atlas-studio-nightly.rb
          cd tap
          git config user.name "atlas nightly"
          git config user.email "noreply@github.com"
          git add Formula/atlas-code-nightly.rb Casks/atlas-studio-nightly.rb
          git diff --cached --quiet && { echo "the tap already names nightly-$STAMP"; exit 0; }
          git commit -m "The tap: the nightly of ${SHA:0:7}"
          git pull --rebase
          git push

  # The newest seven nightly builds stay; a formula a user has not updated yet names one of them.
  prune:
    needs: tap
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("nightly-"))] | sort_by(.createdAt) | reverse | .[7:] | .[].tagName' |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            done
