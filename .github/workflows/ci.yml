name: ci

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # the viewer's model runs in node: engine/tests/plans.rs holds its plans to the code
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast

  # the casks the tap jobs write, as Homebrew reads them: the release they name and its checksums
  tap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/test_tap_cask.py

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --manifest-path studio/src-tauri/Cargo.toml --check

  studio:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Prepare Atlas sidecar
        if: runner.os != 'Windows'
        run: ./studio/prepare-sidecar.sh
      - name: Prepare Atlas sidecar on Windows
        if: runner.os == 'Windows'
        run: ./studio/prepare-sidecar.ps1
      - run: cargo check --locked --manifest-path studio/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path studio/src-tauri/Cargo.toml
      - run: node studio/tests/files.test.js
      - run: node studio/tests/themes.test.js
      - run: node studio/tests/lessons/lesson.test.js
