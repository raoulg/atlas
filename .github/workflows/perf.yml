name: perf

# How fast `next` reads, measured on one runner type and kept as a series per measure on the branch `perf-data`
# (`history.jsonl` and a README of charts). Nothing here compiles Atlas where a release on GitHub holds its build: every
# night, the nightly pre-release built from `next`'s commit reads the programs `perf` reads of the corpus
# (`tools/corpus.txt`) cold and warm, three rounds; a commit no nightly holds is a night skipped, said in the summary. A
# measure past its baseline is suspect, and says nothing yet: the same run measures it again against the last commit that
# lay within it, interleaved on this runner, with the builds the releases hold. Only what that reproduces is reported,
# graded by its size: a small slowdown comments on the tracking issue, a large one opens an urgent issue, to be bisected
# by hand. Every week the same comparison is made between `next` and the last release, on the measures of a release's
# table; by hand, between the last release and any ref (`to`), for a release's notes. By hand, any range can be bisected
# for a measure, and any two commits compared, with where each reading's time went, also on commits of Atlas that both
# read. A run that cannot measure fails; nothing here runs on a push or a pull request. `tools/perf.py` measures and
# judges; `docs/reference/performance.md` says how.

on:
  # no schedule while the measurement is wider than its question: it runs by hand until it downloads its builds and
  # measures three programs cold and warm
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly, weekly, bisect, or compare"
        type: choice
        options: [nightly, weekly, bisect, compare]
        default: nightly
      from:
        description: "bisect: the commit it was fast at; compare: A"
      to:
        description: "bisect: the commit it is slow at (default: next); compare: B (default: the dispatched ref); weekly: the ref measured against the last release, a branch with or without origin/ (default: origin/next)"
      measure:
        description: "bisect: the measure, as perf-data names it (read/atlas/cold/seconds); compare: the measures, separated by spaces"
      subject:
        description: "compare, bisect: commits of Atlas every commit measured reads, each the subject atlas-<its short commit> (optional)"
      issue:
        description: "bisect, compare: the issue to comment the result on (optional)"

permissions:
  contents: write # the series, on perf-data
  issues: write # the tracking issues

concurrency:
  group: perf
  cancel-in-progress: false

env:
  # the subjects of a reproduction: Atlas in each commit's own tree, the corpus as fetched
  SUBJECTS: --subject atlas=. --programs ${{ github.workspace }}/programs

jobs:
  nightly:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 4 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'nightly')
    # one runner type, named, so that a new image is a change to this file and not a step in the series
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUN: ${{ github.workspace }}/run.json
    steps:
      # the tool is next's on the schedule and the dispatched ref's by hand; what is measured is next's commit either way
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'next' }}
          path: atlas
          fetch-depth: 0 # a reproduction checks out the commit it measures against
      - uses: astral-sh/setup-uv@v10.3.0
      # the build the nightly pre-release holds of next's commit; without one the night is skipped, not built
      - name: the nightly build of next
        id: build
        working-directory: atlas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run tools/perf.py download --repo . --commit origin/next --out "$RUNNER_TEMP/atlas-code"
      - name: a night without a build
        if: steps.build.outputs.found != 'true'
        env:
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          echo "No nightly pre-release holds a build of next at ${COMMIT:0:7}: nothing measured tonight." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: the series so far
        if: steps.build.outputs.found == 'true'
        working-directory: atlas
        run: |
          if git ls-remote --exit-code --heads origin perf-data >/dev/null; then
            git fetch --depth 1 origin perf-data
            git worktree add "$GITHUB_WORKSPACE/data" FETCH_HEAD
            git -C "$GITHUB_WORKSPACE/data" switch -c perf-data
          else
            git worktree add --orphan -b perf-data "$GITHUB_WORKSPACE/data"
          fi
      # the corpus's TypeScript programs install their packages with npm
      - uses: actions/setup-node@v5
        if: steps.build.outputs.found == 'true'
        with:
          node-version: 22
      # the corpus's Rust programs fetch their crates with cargo; a side of a reproduction no release holds is built with it
      - uses: dtolnay/rust-toolchain@stable
        if: steps.build.outputs.found == 'true'
      # the corpus's dependencies come from the tools' downloads, kept between runs for one list of programs
      - uses: actions/cache@v4
        if: steps.build.outputs.found == 'true'
        with:
          path: |
            ~/.cache/uv
            ~/.npm
          key: corpus-downloads-${{ runner.os }}-${{ hashFiles('atlas/tools/corpus.txt') }}
      - name: the corpus, at its revisions
        if: steps.build.outputs.found == 'true'
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
          CORPUS_PRIVATE: ${{ secrets.CORPUS_PRIVATE }}
        run: uv run atlas/tools/perf.py corpus fetch --into programs --for perf
      - name: the readings, cold and warm, three rounds
        if: steps.build.outputs.found == 'true'
        working-directory: atlas
        run: |
          uv run tools/perf.py read --atlas "$RUNNER_TEMP/atlas-code" --out "$RUN" --programs ../programs --kinds cold warm --rounds 3
      - name: held to the series
        id: record
        if: steps.build.outputs.found == 'true'
        working-directory: atlas
        env:
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          uv run tools/perf.py record --data "$GITHUB_WORKSPACE/data" --run "$RUN" --commit "$COMMIT" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --data-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/perf-data" \
            --summary "$GITHUB_STEP_SUMMARY" --suspects "$GITHUB_WORKSPACE/suspects.json"
      - name: what is suspect, measured again against the last commit within its baseline
        if: steps.record.outputs.suspect == 'true'
        working-directory: atlas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run tools/perf.py reproduce --repo . --suspects "$GITHUB_WORKSPACE/suspects.json" --programs "$GITHUB_WORKSPACE/programs" \
            --prebuilt --out "$GITHUB_WORKSPACE/reproduced.json"
      - name: graded
        id: conclude
        if: steps.record.outputs.suspect == 'true'
        working-directory: atlas
        run: |
          uv run tools/perf.py conclude --data "$GITHUB_WORKSPACE/data" --reproduced "$GITHUB_WORKSPACE/reproduced.json" \
            --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --data-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/perf-data" \
            --summary "$GITHUB_STEP_SUMMARY" --alert "$GITHUB_WORKSPACE/alert.md"
      # a night is kept even where its reproduction failed: the series holds what was measured
      - name: the series, kept
        if: always() && steps.record.outcome == 'success'
        working-directory: data
        env:
          COMMIT: ${{ steps.build.outputs.commit }}
        run: |
          git config user.name "atlas perf"
          git config user.email "noreply@github.com"
          git add -A
          git commit -q -m "perf: next at ${COMMIT:0:7}"
          git push origin perf-data
      # a large slowdown is an issue of its own, which asks for its bisection; a small one goes to the tracking issue
      - name: the issue
        if: steps.conclude.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URGENT: ${{ steps.conclude.outputs.urgent }}
          TITLE: "Atlas got slower: the nightly measure of next"
        run: |
          if [ "$URGENT" = true ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label performance \
              --title "Urgent: Atlas got much slower ($(date -u +%Y-%m-%d))" --body-file "$GITHUB_WORKSPACE/alert.md"
            exit 0
          fi
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label performance --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$GITHUB_WORKSPACE/alert.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label performance --title "$TITLE" --body-file "$GITHUB_WORKSPACE/alert.md"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf
          path: |
            run.json
            suspects.json
            reproduced.json
            alert.md
            data/README.md
          if-no-files-found: ignore

  # next against the last release, measured interleaved on one runner: creep that no single night shows, and a
  # release's table. Each side reads with the build a release on GitHub holds of it (`--prebuilt`: the stable release
  # at its tag, else the nightly built from its commit); a side no release holds is built here, and the standing says so
  weekly:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 5 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # the tool is next's on the schedule and the dispatched ref's by hand, so that a measure is measured
      # before it lands; what is measured is next either way, or the ref `to` names
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'next' }}
          path: atlas
          fetch-depth: 0
      # the corpus's TypeScript programs install their packages with npm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the corpus's Rust programs fetch their crates with cargo; a side no release holds is built with it
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.0
      # the corpus's dependencies come from the tools' downloads, kept between runs for one list of programs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.npm
          key: corpus-downloads-${{ runner.os }}-${{ hashFiles('atlas/tools/corpus.txt') }}
      - name: the corpus, at its revisions
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
          CORPUS_PRIVATE: ${{ secrets.CORPUS_PRIVATE }}
        run: uv run atlas/tools/perf.py corpus fetch --into programs --for perf
      # the release's table (`--table`: each program `perf` reads cold and warm, its peak memory, and the cards),
      # three rounds: all three of B past all three of A is 1 in 20 by chance, enough for a difference a user notices
      - name: next against the last release
        working-directory: atlas
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ github.event_name == 'workflow_dispatch' && inputs.to || '' }}
        run: |
          release=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          # a branch is named as the checkout has it, origin/<branch>; `release-0.73` is taken as that too
          to=${TO:-origin/next}
          git rev-parse --verify -q "$to^{commit}" >/dev/null || to="origin/$to"
          uv run tools/perf.py reproduce --repo . --a "$release" --b "$to" --programs "$GITHUB_WORKSPACE/programs" \
            --table --rounds 3 --prebuilt --out "$GITHUB_WORKSPACE/weekly.json"
          uv run tools/perf.py conclude --reproduced "$GITHUB_WORKSPACE/weekly.json" --release "$release" \
            --standing "$GITHUB_WORKSPACE/standing.md"
          cat "$GITHUB_WORKSPACE/standing.md" >> "$GITHUB_STEP_SUMMARY"
      - name: the standing, on its issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Atlas's performance against the last release"
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label performance --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$GITHUB_WORKSPACE/standing.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label performance --title "$TITLE" --body-file "$GITHUB_WORKSPACE/standing.md"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-weekly
          path: |
            weekly.json
            standing.md
          if-no-files-found: ignore

  # where a slowdown came from, looked for by hand: the landing on a range that made a measure slower
  bisect:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bisect'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to || 'HEAD' }}
      MEASURE: ${{ inputs.measure }}
      SUBJECT: ${{ inputs.subject }}
      ISSUE: ${{ inputs.issue }}
    steps:
      - name: what to bisect
        run: |
          [ -n "$FROM" ] && [ -n "$MEASURE" ] || { echo "::error::bisect needs from and measure"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: next
          path: atlas
          fetch-depth: 0
      # two commits built with their tests do not fit beside the runner's preinstalled toolchains
      - name: room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.0
      # the corpus's dependencies come from the tools' downloads, kept between runs for one list of programs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.npm
          key: corpus-downloads-${{ runner.os }}-${{ hashFiles('atlas/tools/corpus.txt') }}
      - name: the corpus, at its revisions
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
          CORPUS_PRIVATE: ${{ secrets.CORPUS_PRIVATE }}
        run: uv run atlas/tools/perf.py corpus fetch --into programs --for perf
      - name: bisected
        working-directory: atlas
        run: |
          read -ra subjects <<< "$SUBJECTS"
          for commit in $SUBJECT; do
            short=$(git rev-parse --short=7 "$commit")
            git worktree add --detach "$GITHUB_WORKSPACE/subject-$short" "$commit"
            (cd "$GITHUB_WORKSPACE/subject-$short" && cargo fetch --locked)
            subjects+=(--subject "atlas-$short=$GITHUB_WORKSPACE/subject-$short")
          done
          uv run tools/perf.py bisect --repo . --from "$FROM" --to "$TO" --measure "$MEASURE" "${subjects[@]}" \
            --out "$GITHUB_WORKSPACE/bisect.json" | tee "$GITHUB_WORKSPACE/bisect.md"
          cat "$GITHUB_WORKSPACE/bisect.md" >> "$GITHUB_STEP_SUMMARY"
      - name: the result, on the issue
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$GITHUB_WORKSPACE/bisect.md"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-bisect
          path: bisect.json
          if-no-files-found: ignore

  # two commits measured interleaved by hand, with where each reading's time went (`perf.py stages`); a commit of
  # Atlas that both read tells a slower reader from a larger subject
  compare:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'compare'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to || github.sha }}
      MEASURE: ${{ inputs.measure }}
      SUBJECT: ${{ inputs.subject }}
      ISSUE: ${{ inputs.issue }}
    steps:
      - name: what to compare
        run: |
          [ -n "$FROM" ] && [ -n "$MEASURE" ] || { echo "::error::compare needs from and measure"; exit 1; }
      # the tool is the dispatched ref's, so that a measure is measured before it lands
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: atlas
          fetch-depth: 0
      # two commits built with their tests do not fit beside the runner's preinstalled toolchains
      - name: room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # the corpus's TypeScript programs install their packages with npm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.3.0
      # the corpus's dependencies come from the tools' downloads, kept between runs for one list of programs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.npm
          key: corpus-downloads-${{ runner.os }}-${{ hashFiles('atlas/tools/corpus.txt') }}
      - name: the corpus, at its revisions
        env:
          CORPUS_TOKEN: ${{ secrets.CORPUS_TOKEN }}
          CORPUS_PRIVATE: ${{ secrets.CORPUS_PRIVATE }}
        run: uv run atlas/tools/perf.py corpus fetch --into programs --for perf
      - name: compared
        working-directory: atlas
        run: |
          read -ra subjects <<< "$SUBJECTS"
          for commit in $SUBJECT; do
            short=$(git rev-parse --short=7 "$commit")
            git worktree add --detach "$GITHUB_WORKSPACE/subject-$short" "$commit"
            # its libraries, where Cargo keeps them and Atlas reads them, as the night fetches Atlas's
            (cd "$GITHUB_WORKSPACE/subject-$short" && cargo fetch --locked)
            subjects+=(--subject "atlas-$short=$GITHUB_WORKSPACE/subject-$short")
          done
          measures=()
          for m in $MEASURE; do measures+=(--measure "$m"); done
          uv run tools/perf.py reproduce --repo . --a "$FROM" --b "$TO" "${subjects[@]}" "${measures[@]}" \
            --timings "$GITHUB_WORKSPACE/timings.json" --out "$GITHUB_WORKSPACE/compare.json"
          {
            uv run tools/perf.py stages --timings "$GITHUB_WORKSPACE/timings.json" --reproduced "$GITHUB_WORKSPACE/compare.json"
            echo "The run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$GITHUB_WORKSPACE/compare.md"
          cat "$GITHUB_WORKSPACE/compare.md" >> "$GITHUB_STEP_SUMMARY"
      - name: the result, on the issue
        if: inputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$GITHUB_WORKSPACE/compare.md"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-compare
          path: |
            compare.json
            timings.json
            compare.md
          if-no-files-found: ignore
