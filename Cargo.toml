[workspace]
members = ["engine", "cli"]
exclude = ["studio/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.70.0"
edition = "2021"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/raoulg/atlas"
homepage = "https://github.com/raoulg/atlas"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

# Debug builds and tests read repositories, Atlas's own among them: dependencies (tree-sitter, ty,
# ruff) are built fully optimised, once; the engine lightly, which keeps a rebuild after an edit quick.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.atlas-engine]
opt-level = 1
