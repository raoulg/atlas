[workspace]
members = ["engine", "cli"]
resolver = "2"

[workspace.package]
version = "0.35.0"
edition = "2021"
rust-version = "1.97"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/raoulg/atlas"
homepage = "https://github.com/raoulg/atlas"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
