[package]
name = "atlas"
description = "See how code works: where data rests, and the functions that carry it there"
readme = "../README.md"
keywords = ["code-visualization", "tree-sitter", "architecture", "static-analysis", "mcp"]
categories = ["development-tools", "visualization", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
atlas-engine = { path = "../engine" }
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
