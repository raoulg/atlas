# What Atlas declares about itself. The picture must be four boxes: parse -> lens -> layout,
# with inspect off to the side; the CLI (and later the server) orchestrate, the model is
# the foundation everything reads. Layout is empty until the frontend exists.
order: [Parse, Lens, Layout]
bands:
  top: [CLI, Tests]
  bottom: [Model]
rules:
  atlas-engine: Parse            # lib.rs: analyze = parse, then roles
  atlas-engine.language: Parse
  atlas-engine.python: Parse
  atlas-engine.rust: Parse
  atlas-engine.tree: Parse
  atlas-engine.entries: Parse
  atlas-engine.effects: Parse
  atlas-engine.builder: Parse
  atlas-engine.roles: Lens
  atlas-engine.lens: Lens
  atlas-engine.model: Model
  atlas-engine.tests: Tests
  atlas: CLI
dependencies: against_flow
allowed: []
